spring:
  application:
    name: careerpilot-backend
  autoconfigure:
    # Phase 9.1 — Spring AI Foundation. spring-ai-starter-model-openai (pulled in for
    # ai.careerpilot.ai.springai's foundation beans — see ai.springai.foundation below)
    # ships its own autoconfiguration that would otherwise activate on properties
    # this app doesn't set today (e.g. spring.ai.openai.api-key) and silently create
    # its own ChatModel/EmbeddingModel beans outside our control. Excluded so the
    # ONLY Spring AI beans that ever exist are the explicitly-gated ones built by
    # ai.careerpilot.ai.springai.SpringAiConfig — zero chance of accidental
    # auto-activation, zero effect on the existing AI Gateway either way.
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      # Phase 9.3 — same reasoning as the OpenAI exclusions above, for the Google
      # GenAI starter added for GeminiSpringAiProvider. Without this, merely having
      # the starter on the classpath makes Spring AI try to auto-construct its OWN
      # googleGenAiClient/ChatModel bean from spring.ai.google.genai.* properties —
      # which this app never sets (GeminiSpringAiProvider builds its own client
      # explicitly from ai.gateway.providers.gemini.* instead) — crashing startup
      # with "Incomplete Google GenAI configuration" regardless of any migration
      # flag (caught in local verification, exactly like the OpenAI case in Phase 9.1).
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
  lifecycle:
    # Ceiling for server.shutdown=graceful: how long Tomcat waits for in-flight
    # requests to finish before the JVM forces exit on SIGTERM. Set above the
    # agent-service's own read-timeout-ms (120s, see agent-service block below)
    # so an in-flight workflow call isn't truncated mid-shutdown.
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:45s}
  task:
    scheduling:
      pool:
        # Default Spring Boot scheduling pool is 1 thread — shared by every
        # @Scheduled class (job discovery, job lake, retention, candidate-profile
        # rebuild, company discovery, autopilot, career orchestrator). With more
        # than one of those trigger flags enabled and overlapping cron times, a
        # single-threaded pool lets one long run silently starve the others.
        size: ${TASK_SCHEDULER_POOL_SIZE:4}
  datasource:
    # DATABASE_URL is a JDBC URL. Neon credentials can be embedded as query
    # params (?user=...&password=...) so one var covers auth too; the
    # SPRING_DATASOURCE_USERNAME/PASSWORD vars below remain as an optional
    # override if you'd rather keep credentials out of the URL string.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/careerpilot}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      # Neon serverless can recycle/suspend idle connections server-side; keep our
      # pool's max-lifetime comfortably under that so Hikari retires connections
      # proactively instead of handing out ones the server has already dropped.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1500000}
      # 0 = disabled (framework default). Set DB_LEAK_DETECTION_MS (e.g. 60000) in
      # an env that's suspected of leaking connections; leave 0 in steady-state
      # prod to avoid the per-checkout timing overhead.
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc.lob.non_contextual_creation: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      # Single connection-string form: redis://[:password@]host:port, or
      # rediss://... for TLS (Upstash and most managed Redis require TLS).
      url: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Spring Boot autoconfigures the ProducerFactory (and reserves its buffer-memory)
      # at context startup regardless of careerpilot.kafka.enabled, since that flag only
      # gates whether WorkflowEventProducer publishes. Kafka's own default buffer-memory
      # is 32MB — trim it hard for memory-constrained deploys (e.g. Render free 512MB).
      buffer-memory: ${KAFKA_PRODUCER_BUFFER_MEMORY:1048576}
      properties:
        max.block.ms: 1000
    consumer:
      group-id: careerpilot
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  web:
    error:
      include-message: always
  # ---- Phase 10.3 — Enterprise Capability Engine & Spring AI Tool Orchestration. This
  # exact property path (spring.ai.tool.calling.enabled) is what the phase spec names;
  # placed under this pre-existing top-level `spring:` block rather than a second one
  # (YAML forbids duplicate top-level keys). Read only by
  # ai.careerpilot.capability.CapabilityConfig — safe to live under Spring AI's own
  # namespace since its autoconfiguration for this prefix is already excluded above
  # (Phase 9.1/9.3) and no real Spring AI property named `tool.calling.enabled` exists
  # to collide with.
  ai:
    tool:
      calling:
        enabled: ${SPRING_AI_TOOL_CALLING_ENABLED:false}

server:
  shutdown: graceful
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:20}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:4}
    accept-count: ${TOMCAT_ACCEPT_COUNT:20}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

ai:
  provider: ${AI_PROVIDER:gemini}
  model: ${AI_MODEL:gemini-2.5-flash}   # flash is free-tier eligible; pro returns 429 limit:0 on free keys
  gemini:
    api-key: ${GEMINI_API_KEY:}
  # ---- Phase 9.1 — Spring AI Foundation. Entirely separate from `gateway` below:
  # nothing here is read by AiGatewayService, the Smart Router, or any business
  # service — see ai.careerpilot.ai.springai.SpringAiConfig, the only reader of
  # this block. `enabled` defaults false (same dark-by-default convention as every
  # other phase in this codebase), so by default SpringAiConfig's beans don't even
  # get created. Flipping it on only constructs the beans — nothing consumes them
  # yet, so even "on" has zero effect on any request path. ----
  springai:
    foundation:
      enabled: ${SPRING_AI_FOUNDATION_ENABLED:false}
      # OpenAI-compatible endpoint used only by the foundation beans. Defaults to
      # NVIDIA's endpoint (same one ai.gateway.providers.deepseek_flash already
      # calls) purely as a convenience default since it's a known-good
      # OpenAI-compatible base-url — this is a SEPARATE HTTP client instance from
      # NvidiaProvider's; the two share nothing at runtime.
      base-url: ${SPRING_AI_FOUNDATION_BASE_URL:https://integrate.api.nvidia.com/v1}
      api-key: ${SPRING_AI_FOUNDATION_API_KEY:}
      chat-model: ${SPRING_AI_FOUNDATION_CHAT_MODEL:deepseek-ai/deepseek-v4-flash}
      embedding-model: ${SPRING_AI_FOUNDATION_EMBEDDING_MODEL:nvidia/nv-embedqa-e5-v5}
      # Phase 9.2 — governs SpringAiLlmProvider.timeout(). Same env var also mirrored
      # into ai.gateway.providers.spring_ai.timeout-ms below (display metadata only)
      # so the two can never drift apart.
      timeout-ms: ${SPRING_AI_FOUNDATION_TIMEOUT_MS:20000}
  # ---- AI Gateway: single entry point for all LLM calls, with failover ----
  gateway:
    primary: ${PRIMARY_PROVIDER:deepseek_flash}
    # Failover priority: [NVIDIA cluster: DeepSeek Flash → DeepSeek pro/reasoning →
    # Qwen] → Gemini → Groq → [SambaNova cluster: DeepSeek-V3.2 → DeepSeek-V3.1 →
    # gpt-oss-120b → Llama-3.3-70B → gemma-4-31B → MiniMax-M2.7] → OpenRouter.
    #
    # The two remaining NVIDIA models are served by ONE OpenAI-compatible endpoint
    # via a single NvidiaProvider class (see ai/provider/NvidiaProvider.java +
    # NvidiaProviderConfig) — not one class per model — even though each has its
    # own dedicated API key (see `providers` below). Same pattern for the six
    # SambaNova models via SambaNovaProvider/SambaNovaProviderConfig.
    #
    # Kimi and GLM were tried (live-tested: Kimi returned HTTP 404 "not entitled",
    # GLM never responded within any reasonable timeout) and are now FULLY REMOVED
    # — not disabled — from this order, ai.gateway.nvidia.models, ai.gateway.providers,
    # resilience4j instances, NvidiaProviderConfig's @Bean methods, and every doc/test
    # that referenced them. Their enterprise-grade replacements live in OpenRouter's
    # model pool below (see `open-router`).
    #
    # Qwen isn't part of the current 5-vendor priority list (NVIDIA → Gemini → Groq
    # → SambaNova → OpenRouter) but is left live, grouped into the NVIDIA cluster
    # (it's NVIDIA-hosted too) — it's a working, previously-verified provider and
    # removing it would be a routing regression.
    #
    # Unconfigured providers (no API key, or a cluster's models[].enabled=false)
    # are skipped automatically. This list is the ONLY place provider ORDER is
    # defined — AiGatewayService has no hardcoded ordering, so re-prioritizing or
    # adding a provider is a config change, never a Java change. OpenRouter is a
    # single slot here ("openrouter") — internally it's a dynamic, capability-based
    # pool of models, not one fixed model (see `open-router` below).
    #
    # Phase 9.2 — "spring_ai" is the canary LAST slot: a real, callable provider
    # (ai.careerpilot.ai.provider.SpringAiLlmProvider) backed by the Phase 9.1
    # Spring AI foundation beans (ai.springai.foundation.*, gated separately and
    # off by default). It's only reached after every provider above has failed,
    # and isConfigured() is false (see SpringAiLlmProvider) unless BOTH
    # ai.springai.foundation.enabled=true AND a real api-key is set — so with
    # stock config this slot is always skipped, identical to today's behavior.
    order: ${AI_PROVIDER_ORDER:deepseek_flash,deepseek,qwen,gemini,groq,sambanova_deepseek_v3_2,sambanova_deepseek_v3_1,sambanova_gpt_oss_120b,sambanova_llama_3_3_70b,sambanova_gemma_4_31b,sambanova_minimax_m2_7,openrouter,spring_ai}
    default-temperature: 0.4
    # NVIDIA NIM model-cluster metadata (id/priority/enabled only — credentials/model
    # id/timeout for each of these keys still live under `providers` below, unchanged
    # mechanism). `priority` documents each model's intended relative order WITHIN the
    # NVIDIA cluster; the actual routing order remains `order` above, so there is one
    # real ordering mechanism, not two competing ones. `enabled` is an explicit kill
    # switch independent of whether that model's own NVIDIA API key is set.
    nvidia:
      models:
        - id: deepseek_flash
          priority: 1
          enabled: true
        - id: deepseek
          priority: 2
          enabled: true
    # SambaNova model-cluster metadata — same shape/semantics as `nvidia` above.
    sambanova:
      models:
        - id: sambanova_deepseek_v3_2
          priority: 1
          enabled: true
        - id: sambanova_deepseek_v3_1
          priority: 2
          enabled: true
        - id: sambanova_gpt_oss_120b
          priority: 3
          enabled: true
        - id: sambanova_llama_3_3_70b
          priority: 4
          enabled: true
        - id: sambanova_gemma_4_31b
          priority: 5
          enabled: true
        - id: sambanova_minimax_m2_7
          priority: 6
          enabled: true
    # ---- OpenRouter: dynamic, capability-based model pool (last-resort fallback) ----
    # Unlike `nvidia`/`sambanova` above (a fixed set of models, each its own @Bean and
    # its own `order` slot), OpenRouter is ONE provider bean ("openrouter" in `order`)
    # that internally selects from the model pool below, grouped by capability — see
    # ai/provider/OpenRouterProvider.java + OpenRouterModelRegistry. No model id is
    # ever hardcoded in Java; every model referenced anywhere in this pool is written
    # here and nowhere else.
    open-router:
      enabled: true
      # Validates the lists below against OpenRouter's live GET /v1/models catalog once
      # at startup (ApplicationReadyEvent — strictly after the app has already started,
      # so a slow/failed/disabled call can never block or fail startup). A model missing
      # from the live catalog is skipped for routing purposes and logged as a WARNING —
      # it is never removed from this config and never stops the app from starting.
      auto-discover-models: ${OPENROUTER_AUTO_DISCOVER_MODELS:true}
      refresh-models-on-startup: ${OPENROUTER_REFRESH_MODELS_ON_STARTUP:true}
      validate-configured-models: ${OPENROUTER_VALIDATE_CONFIGURED_MODELS:true}
      capabilities:
        # Resume Agent / ATS Agent / Job Discovery → REASONING (DeepSeek V4 Flash first).
        # Interview Coach / Career Strategy / Company Intelligence also map to REASONING —
        # Nemotron 3 Ultra/Super are next in line once DeepSeek V4 Flash is unavailable.
        reasoning:
          preferred:
            - deepseek/deepseek-v4-flash
            - nvidia/nemotron-3-ultra-550b-a55b:free
            - nvidia/nemotron-3-super-120b-a12b:free
        # Coding Assistant → CODING.
        coding:
          preferred:
            - cohere/north-mini-code:free
        # General Chat → CHAT.
        chat:
          preferred:
            - google/gemma-4-26b-a4b-it:free
        # Low Latency → LIGHTWEIGHT. gpt-oss-20b is also the "additional fallback" model
        # from the modernization brief, so it's listed here ahead of Nemotron Nano 30B.
        lightweight:
          preferred:
            - openai/gpt-oss-20b:free
            - nvidia/nemotron-3-nano-30b-a3b:free
    # Phase A Enterprise Smart Router feature flag. false = pure sequential
    # failover over `order` (current production behavior, unchanged). Task-aware
    # routing using `routing` below is wired in a later phase and only takes
    # effect when this is true.
    smart-router-enabled: ${AI_SMART_ROUTER_ENABLED:false}
    # Per-task provider preference lists. LOADED BUT NOT CONSULTED in Phase A
    # (only used when smart-router-enabled=true). Lets per-task provider order
    # change via config alone — no code change. Unknown providers in a list are
    # ignored; unconfigured ones are skipped, exactly like `order`.
    routing:
      resumeOptimization: [deepseek, gemini, openrouter]
      atsOptimization: [deepseek, gemini, qwen]
      jobMatching: [deepseek, qwen, openrouter]
      chatbot: [deepseek, gemini, openrouter]
      interviewPreparation: [gemini, deepseek, groq]
      careerStrategy: [gemini, deepseek, openrouter]
      salaryIntelligence: [gemini, qwen, openrouter]
    providers:
      # ---- NVIDIA NIM cluster (priorities 1-4) — same OpenAI-compatible endpoint,
      # served by the single NvidiaProvider class (see ai/provider/NvidiaProvider.java).
      # Each model has its OWN dedicated API key below (they don't have to share one —
      # AbstractOpenAiChatProvider reads api-key per provider-key config, same mechanism
      # as every other provider), so one model's key/quota is fully independent of the
      # others'. ----
      # Priority 1 — fast/cheap DeepSeek variant. Split into its own provider key
      # (rather than swapping the "deepseek" key's model) so flash and pro/reasoning
      # DeepSeek can occupy two different priorities in `order` at the same time.
      deepseek_flash:
        display-name: DeepSeek Flash
        api-key: ${NVIDIA_DEEPSEEK_FLASH_API_KEY:}
        model: ${NVIDIA_DEEPSEEK_FLASH_MODEL:deepseek-ai/deepseek-v4-flash}
        base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
        # Live-observed (2026-07-26): on NVIDIA's shared free-tier NIM endpoint this
        # model's real successful calls complete in ~2s; failures are congestion, not
        # slowness, and previously waited the full 15s before failing over. Lowered so
        # a congested attempt fails over to the next provider (deepseek/qwen/Gemini)
        # in ~7s instead of 15s — three of these are stacked ahead of Gemini in
        # ai.gateway.order, so this timeout is multiplied by up to 3x in the worst case.
        timeout-ms: 7000
        cost-tier: low
        supports-reasoning: false
      # Priority 2 — DeepSeek pro/reasoning variant. Key stays "deepseek" (not
      # "deepseek_v4") for backward compatibility — resume.tailoring.preferred-providers,
      # ai.gateway.routing.*, and diagnostics health checks all already name it "deepseek".
      # NVIDIA NIM IDs are vendor-namespaced; the bare "deepseek-v4-pro" 404s, keep the
      # "deepseek-ai/" prefix in the default.
      deepseek:
        display-name: DeepSeek
        api-key: ${DEEP_SHEEK_NVIDIA_API_KEY:}
        model: ${NVIDIA_DEEPSEEK_MODEL:deepseek-ai/deepseek-v4-pro}
        base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
        # Live-tested: this model genuinely works but took 74s on a cold start —
        # the previous 20s timeout would have failed (and failed over) on every
        # single call. Raised based on real observed latency, not guessed.
        timeout-ms: 90000
        cost-tier: medium
        supports-reasoning: true
      # Priority 3 — also NVIDIA NIM-hosted (its own dedicated NVIDIA account/key),
      # but kept as its own top-level QwenProvider class rather than folded into
      # NvidiaProvider. Not part of the current 5-vendor priority list either, but
      # left live/grouped with the NVIDIA cluster since it's a working,
      # previously-verified provider.
      qwen:
        display-name: Qwen
        api-key: ${QWEN3_NVIDIA_API_KEY:}
        model: ${NVIDIA_QWEN_MODEL:qwen/qwen3-next-80b-a3b-instruct}
        base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
        # Lowered alongside deepseek_flash above (2026-07-26) — same shared-NIM
        # congestion reasoning, no documented cold-start need like deepseek (pro)
        # has, so there's no legitimate slow-success case this would cut off.
        timeout-ms: 8000
        cost-tier: medium
      # Priority 4.
      gemini:
        display-name: Gemini
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_MODEL:gemini-2.5-flash}
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
        timeout-ms: 15000
        cost-tier: low
      # Priority 5.
      groq:
        display-name: Groq
        api-key: ${GROQ_API_KEY:}
        model: ${GROQ_MODEL:llama-3.3-70b-versatile}
        base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
        timeout-ms: 20000
        cost-tier: low
      # ---- SambaNova cluster (priorities 6-11) — same OpenAI-compatible endpoint,
      # served by the single SambaNovaProvider class (see
      # ai/provider/SambaNovaProvider.java). All share one SAMBANOVA_API_KEY by
      # default (SambaNova issues one key per account, unlike NVIDIA's per-model
      # keys tested earlier) — override any individual key below if that changes.
      # Timeouts are generous (120s) based on the NVIDIA cluster's observed cold-start
      # latency (70-130s) for comparable hosted models; tune down once SambaNova's
      # own latency is measured in production. ----
      # Priority 6 — primary.
      sambanova_deepseek_v3_2:
        display-name: SambaNova DeepSeek V3.2 (Primary)
        api-key: ${SAMBANOVA_API_KEY:}
        model: ${SAMBANOVA_DEEPSEEK_V32_MODEL:DeepSeek-V3.2}
        base-url: ${SAMBANOVA_BASE_URL:https://api.sambanova.ai/v1}
        timeout-ms: 120000
        cost-tier: low
        supports-reasoning: true
      # Priority 7 — secondary DeepSeek variant, verified available, no named role.
      sambanova_deepseek_v3_1:
        display-name: SambaNova DeepSeek V3.1
        api-key: ${SAMBANOVA_API_KEY:}
        model: ${SAMBANOVA_DEEPSEEK_V31_MODEL:DeepSeek-V3.1}
        base-url: ${SAMBANOVA_BASE_URL:https://api.sambanova.ai/v1}
        timeout-ms: 120000
        cost-tier: low
        supports-reasoning: true
      # Priority 8 — reasoning.
      sambanova_gpt_oss_120b:
        display-name: SambaNova gpt-oss-120b (Reasoning)
        api-key: ${SAMBANOVA_API_KEY:}
        model: ${SAMBANOVA_GPT_OSS_MODEL:gpt-oss-120b}
        base-url: ${SAMBANOVA_BASE_URL:https://api.sambanova.ai/v1}
        timeout-ms: 120000
        cost-tier: medium
        supports-reasoning: true
      # Priority 9 — conversation.
      sambanova_llama_3_3_70b:
        display-name: SambaNova Llama 3.3 70B (Conversation)
        api-key: ${SAMBANOVA_API_KEY:}
        model: ${SAMBANOVA_LLAMA_MODEL:Meta-Llama-3.3-70B-Instruct}
        base-url: ${SAMBANOVA_BASE_URL:https://api.sambanova.ai/v1}
        timeout-ms: 120000
        cost-tier: low
        supports-reasoning: false
      # Priority 10 — fast.
      sambanova_gemma_4_31b:
        display-name: SambaNova Gemma 4 31B (Fast)
        api-key: ${SAMBANOVA_API_KEY:}
        model: ${SAMBANOVA_GEMMA_MODEL:gemma-4-31B-it}
        base-url: ${SAMBANOVA_BASE_URL:https://api.sambanova.ai/v1}
        timeout-ms: 90000
        cost-tier: low
        supports-reasoning: false
      # Priority 11 — fallback (last SambaNova model before OpenRouter).
      sambanova_minimax_m2_7:
        display-name: SambaNova MiniMax M2.7 (Fallback)
        api-key: ${SAMBANOVA_API_KEY:}
        model: ${SAMBANOVA_MINIMAX_MODEL:MiniMax-M2.7}
        base-url: ${SAMBANOVA_BASE_URL:https://api.sambanova.ai/v1}
        timeout-ms: 120000
        cost-tier: low
        supports-reasoning: false
      # Priority 12 — last-resort fallback. api-key empty by default → provider is
      # UNAVAILABLE and skipped. Supply OPENROUTER_API_KEY to activate. NOTE: unlike
      # every other entry in this map, `model` is intentionally unused here —
      # OpenRouterProvider overrides isConfigured() to ignore it and instead selects
      # a model per-call from the pool defined in ai.gateway.open-router.capabilities
      # above. timeout-ms still applies to every call this provider makes.
      openrouter:
        display-name: OpenRouter
        api-key: ${OPENROUTER_API_KEY:}
        base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
        timeout-ms: 30000
        cost-tier: unknown
      # Priority 13 (canary, last) — diagnostics/display metadata ONLY. Actual
      # credentials/model/timeout for SpringAiLlmProvider come from
      # ai.springai.foundation.* (same env vars referenced below, so they can't
      # drift) — this block exists purely so GET /api/diagnostics/ai shows a real
      # model/timeout instead of blanks; SpringAiLlmProvider does not read
      # ai.gateway.providers.spring_ai at all.
      spring_ai:
        display-name: Spring AI (canary)
        model: ${SPRING_AI_FOUNDATION_CHAT_MODEL:deepseek-ai/deepseek-v4-flash}
        timeout-ms: ${SPRING_AI_FOUNDATION_TIMEOUT_MS:20000}
        cost-tier: unknown

  # ---- Embeddings: pgvector semantic search (Phase 2 Increment A) ----
  # Gated DARK by default. When enabled, discovered jobs (post-ingest, capped) and resumes (on
  # upload) get a Gemini text-embedding-004 vector (768-d, matching the vector(768) columns), and
  # GET /api/jobs/search/semantic does a cosine nearest-neighbor read. Reuses the gemini API key
  # from ai.gateway.providers.gemini — no separate key. Default off = zero new AI cost / no behavior
  # change; instant rollback by flipping the flag.
  embeddings:
    enabled: ${EMBEDDINGS_ENABLED:false}
    # gemini-embedding-001 supports outputDimensionality; we request 768 to match the vector(768)
    # columns. (text-embedding-004 is not available on this API key — it 404s.)
    model: ${EMBEDDINGS_MODEL:gemini-embedding-001}
    dimensions: ${EMBEDDINGS_DIMENSIONS:768}
    # Max characters of source text sent to the embedding API (cost + payload guard).
    max-chars: ${EMBEDDINGS_MAX_CHARS:8000}
    # Cap on how many missing-embedding jobs are embedded per discovery run (cost guard).
    max-per-run: ${EMBEDDINGS_MAX_PER_RUN:200}

# ---- Resilience4j: retry + circuit breaker per provider ----
resilience4j:
  retry:
    instances:
      # 2 retries before failing over (3 attempts total), exponential backoff
      # 1s → 2s. Quota/rate-limit (429) is mapped to QuotaExceededException and
      # ignored here, so a rate-limited provider fails over immediately instead of
      # burning the retry budget. CallNotPermittedException (open circuit) likewise
      # short-circuits straight to the next provider.
      gemini: &retryDefaults
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.lang.Exception
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - ai.careerpilot.ai.QuotaExceededException
      # Slow, cold-start-prone models (70-130s observed) get 1 attempt instead of 3 —
      # retrying a call that can take up to ~120s each would stack to 6+ minutes
      # before the gateway even reaches the next provider in the chain. A single
      # failed attempt here still fails over immediately to the next configured
      # provider; it just doesn't retry *within* this slow provider first.
      deepseek: &slowColdStartRetry
        max-attempts: 1
        retry-exceptions:
          - java.lang.Exception
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - ai.careerpilot.ai.QuotaExceededException
      sambanova_deepseek_v3_2: *slowColdStartRetry
      sambanova_deepseek_v3_1: *slowColdStartRetry
      sambanova_gpt_oss_120b: *slowColdStartRetry
      sambanova_llama_3_3_70b: *slowColdStartRetry
      sambanova_gemma_4_31b: *slowColdStartRetry
      sambanova_minimax_m2_7: *slowColdStartRetry
      deepseek_flash: *retryDefaults
      groq: *retryDefaults
      qwen: *retryDefaults
      openrouter: *retryDefaults
      spring_ai: *retryDefaults
  circuitbreaker:
    instances:
      gemini: &cbDefaults
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 8
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      deepseek: *cbDefaults
      deepseek_flash: *cbDefaults
      groq: *cbDefaults
      qwen: *cbDefaults
      sambanova_deepseek_v3_2: *cbDefaults
      sambanova_deepseek_v3_1: *cbDefaults
      sambanova_gpt_oss_120b: *cbDefaults
      sambanova_llama_3_3_70b: *cbDefaults
      sambanova_gemma_4_31b: *cbDefaults
      sambanova_minimax_m2_7: *cbDefaults
      openrouter: *cbDefaults
      spring_ai: *cbDefaults

# ---- Phase 9.3 — Spring AI Provider Migration flags. Read only by
# ai.careerpilot.ai.migration.ProviderRegistryConfig, which is the ONLY place that
# decides whether a provider key resolves to its legacy or Spring-AI-backed
# implementation. AiGatewayService/the Smart Router never read this block and don't
# know it exists. All default false = production behavior identical to before this
# phase. Only "gemini" has a real second implementation today (GeminiSpringAiProvider)
# — the other five keys exist so their config shape is stable for future migration
# phases, but flipping one currently has no effect (see SpringAiMigrationProperties'
# own javadoc). Rollback for any migrated provider is config-only: set its flag back
# to false and restart — no code change, no redeploy artifact change. ----
spring-ai:
  providers:
    gemini:
      enabled: ${SPRING_AI_MIGRATE_GEMINI:false}
    groq:
      enabled: ${SPRING_AI_MIGRATE_GROQ:false}
    sambanova:
      enabled: ${SPRING_AI_MIGRATE_SAMBANOVA:false}
    nvidia:
      enabled: ${SPRING_AI_MIGRATE_NVIDIA:false}
    qwen:
      enabled: ${SPRING_AI_MIGRATE_QWEN:false}
    openrouter:
      enabled: ${SPRING_AI_MIGRATE_OPENROUTER:false}

# ---- Phase 10.1 — Enterprise MCP Foundation. Platform-only: no MCP server is
# implemented or connected. See ai.careerpilot.mcp.McpConfig, the only reader of
# this block, and the package's own javadoc for the full architecture. All three
# flags default false — with `enabled: false`, McpRegistry/McpMetrics beans don't
# even get created; `health.enabled: false` likewise skips McpHealthManager.
# `discovery.enabled` is reserved for a future server auto-discovery mechanism —
# nothing reads it yet in this phase. Zero effect on AiGatewayService, Spring AI,
# LangGraph, or any business service regardless of these values. ----
mcp:
  enabled: ${MCP_ENABLED:false}
  discovery:
    enabled: ${MCP_DISCOVERY_ENABLED:false}
  health:
    enabled: ${MCP_HEALTH_ENABLED:false}
  # ---- Phase 10.2 — first real MCP tool servers, each independently flagged and each
  # a thin read-only wrapper around an existing service/repository (no new tables, no
  # new queries beyond existing finder methods). Every flag defaults false; each
  # server's own @Configuration class also requires `mcp.enabled: true` (see e.g.
  # ai.careerpilot.mcp.tool.filesystem.FilesystemMcpServerConfig). None of these are
  # called by any business service, AiGatewayService, or ChatModel bean — see the
  # ai.careerpilot.mcp package javadoc. ----
  filesystem:
    enabled: ${MCP_FILESYSTEM_ENABLED:false}
  postgres:
    enabled: ${MCP_POSTGRES_ENABLED:false}
  github:
    enabled: ${MCP_GITHUB_ENABLED:false}
    base-url: ${MCP_GITHUB_BASE_URL:https://api.github.com}
    user-agent: ${MCP_GITHUB_USER_AGENT:CareerPilotAI/1.0 (+https://careerpilot.ai)}
  memory:
    enabled: ${MCP_MEMORY_ENABLED:false}
  # Keyed, unlike the four servers above — isConfigured() (api-key non-blank) gates
  # actual tool registration even when this flag is true. Endpoint shape is
  # best-effort/not live-verified — see Context7ApiClient's javadoc.
  context7:
    enabled: ${MCP_CONTEXT7_ENABLED:false}
    api-key: ${MCP_CONTEXT7_API_KEY:}
    base-url: ${MCP_CONTEXT7_BASE_URL:https://context7.com/api}
    timeout-ms: ${MCP_CONTEXT7_TIMEOUT_MS:10000}

# ---- Phase 10.3 — Enterprise Capability Engine & Spring AI Tool Orchestration. See
# ai.careerpilot.capability.CapabilityConfig, the only reader of these four flags, and
# the package's own javadoc. `capability.engine.enabled` is the master switch — off
# (default), none of ai.careerpilot.capability's beans exist and AiGatewayService
# remains the only chat path, unchanged. The other three are runtime toggles read
# inside that already-dark layer (see CapabilityConfig's own javadoc for exactly
# where each is consulted) — all default false, so even with the master flag on,
# every request falls back to AiGatewayService until each is explicitly enabled.
capability:
  engine:
    enabled: ${CAPABILITY_ENGINE_ENABLED:false}
  # Phase 11.2 — Capability Planner. See ai.careerpilot.planner.PlannerConfig, the only
  # reader of this flag. Produces CapabilityPlans only — does not execute them (Phase
  # 11.3's job) and is not called by the Copilot or any other business service yet.
  planner:
    enabled: ${CAPABILITY_PLANNER_ENABLED:false}
tool:
  selection:
    enabled: ${TOOL_SELECTION_ENABLED:false}
parallel:
  tool:
    execution:
      enabled: ${PARALLEL_TOOL_EXECUTION_ENABLED:false}
# `spring.ai.tool.calling.enabled` (the phase spec's exact requested property path) is
# added under the existing top-level `spring:` block near the top of this file, not
# duplicated here — YAML forbids a second top-level `spring:` key. See that block's
# `ai.tool.calling.enabled` entry.

# ---- Phase 11.1 — Enterprise Intent Engine. See ai.careerpilot.intent.IntentConfig, the
# only reader of this block. `enabled: false` (default) means none of
# ai.careerpilot.intent's beans are constructed and nothing outside that package can
# reference them — see the package javadoc for the "not wired into Copilot yet" scope
# note (that's Phase 11.2's job). `min-confidence` is the DefaultIntentEngine threshold
# below which a classification is treated as no-match/fallback.
intent:
  engine:
    enabled: ${INTENT_ENGINE_ENABLED:false}
    min-confidence: ${INTENT_ENGINE_MIN_CONFIDENCE:0.4}

# ---- Phase 11.3 — Multi-Capability Execution. See
# ai.careerpilot.planner.execution.MultiCapabilityExecutionConfig, the only reader of
# this block. `enabled: false` (default) means none of that package's beans are
# constructed. Executes a CapabilityPlan (Phase 11.2) stage by stage, parallel within a
# stage — not called by the Copilot or any other business service yet. `max-retries` is
# how many additional whole-step attempts DefaultCapabilityExecutor makes after an
# initial failure before giving up on that capability.
multi:
  capability:
    enabled: ${MULTI_CAPABILITY_ENABLED:false}
    max-retries: ${MULTI_CAPABILITY_MAX_RETRIES:1}

# ---- Phase 11.4 — Enterprise Memory Evolution. See
# ai.careerpilot.memory.enterprise.EnterpriseMemoryConfig, the only reader of this
# block. `enabled: false` (default) means none of that package's beans are
# constructed. Additive alongside CareerMemoryService/ConversationMemory/Memory MCP —
# does not replace or read from any of them, in-memory only (no new DB table), and not
# called by the Copilot or any other business service yet.
enterprise:
  memory:
    enabled: ${ENTERPRISE_MEMORY_ENABLED:false}
    working-ttl-hours: ${ENTERPRISE_MEMORY_WORKING_TTL_HOURS:24}
    promotion-access-threshold: ${ENTERPRISE_MEMORY_PROMOTION_ACCESS_THRESHOLD:3}
    max-entries-per-type: ${ENTERPRISE_MEMORY_MAX_ENTRIES_PER_TYPE:200}

agent-service:
  base-url: ${AGENT_SERVICE_URL:http://localhost:8088}
  connect-timeout-ms: 5000
  read-timeout-ms: 120000

security:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: 60
    refresh-token-ttl-days: 30
  rate-limit:
    # Phase 8.1 — these two values existed unenforced since the original scaffold; RateLimitFilter
    # now reads them. Dark-shipped: flip enabled to true to activate (in-memory, single-VM only).
    enabled: ${SECURITY_RATE_LIMIT_ENABLED:false}
    auth-per-minute: 10
    api-per-minute: 120
  # Phase 8.1 — AuditService now writes to the previously-dead audit_logs table when enabled.
  audit:
    enabled: ${SECURITY_AUDIT_ENABLED:false}
  # Comma-separated exact origins — no wildcards. Set to your Vercel URL(s),
  # e.g. https://careerpilot-ai.vercel.app,https://careerpilot-ai-git-main.vercel.app
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

storage:
  s3:
    endpoint: ${MINIO_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${MINIO_BUCKET:careerpilot}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    path-style: true

kafka:
  topics:
    workflow-events: careerpilot.workflow.events
    audit-events: careerpilot.audit.events

careerpilot:
  kafka:
    # When false (or Kafka unreachable), workflow event publishing is skipped
    # silently so a missing/broken broker never breaks the workflow path.
    enabled: ${KAFKA_ENABLED:true}

# ---- Phase 2 Job Discovery ----
# Real-job ingest from adapter providers. Keyless providers (RemoteOK, Arbeitnow)
# always run; keyed providers (Adzuna, Jooble) are skipped until their keys are set,
# so the platform works on free infra with zero extra config.
jobs:
  # ---- Recommendation engine (rule-based 6-factor scoring + LLM explanations) ----
  # All flag-gated for instant rollback: v2-enabled=false reverts Recommended to the
  # legacy unthresholded behavior with no redeploy.
  enrich:
    enabled: ${JOB_ENRICH_ENABLED:true}          # keyword classification at ingest
    # ---- LLM job enrichment (Phase 2 Increment B) ----
    # Semantic enrichment the keyword tier can't derive (seniority/skills/domains/salary-band/summary),
    # via the AI Gateway. Stored in the 1:1 job_ai_enrichment table; produced-but-not-consumed in v1
    # (matching does not read it yet). Gated DARK by default → zero LLM cost / no behavior change.
    ai:
      enabled: ${JOBS_ENRICH_AI_ENABLED:false}
      # Cap on how many missing-enrichment jobs are enriched per run (scheduler + backfill) — cost guard.
      max-per-run: ${JOBS_ENRICH_AI_MAX_PER_RUN:200}
      # Max characters of the job description sent to the LLM (cost + payload guard).
      max-chars: ${JOBS_ENRICH_AI_MAX_CHARS:6000}
      # Per-call provider preference for this structured-extraction task: prefer a FAST model
      # (gemini flash) over the default deepseek reasoning model (~68s/job → a few seconds). Still
      # falls back to the rest of the gateway chain on failure. Comma-separated; first configured wins.
      providers: ${JOBS_ENRICH_AI_PROVIDERS:gemini}
  # ---- Fuzzy job deduplication (Phase 2 Increment C) ----
  # Detects cross-source duplicate postings (same job on RemoteOK and Arbeitnow, say) via embedding
  # cosine similarity (Increment A) confirmed by title/company text match. Stored in job_duplicates;
  # produced-but-not-consumed in v1 — Browse/Recommended/Discovered do NOT filter on this yet.
  # Gated DARK by default → no rows written until explicitly flipped on.
  dedup:
    enabled: ${JOBS_DEDUP_ENABLED:false}
    # Cap on how many unchecked jobs are duplicate-checked per run (scheduler + backfill).
    max-per-run: ${JOBS_DEDUP_MAX_PER_RUN:200}
    # Minimum cosine similarity (1 - distance) for a neighbor to even be considered a candidate.
    embedding-threshold: ${JOBS_DEDUP_EMBEDDING_THRESHOLD:0.92}
    # Minimum title-token Jaccard similarity required when company names don't match exactly.
    title-jaccard-threshold: ${JOBS_DEDUP_TITLE_JACCARD_THRESHOLD:0.55}
  # ---- Industry / job-family quality filter ----
  # Excludes non-technical families (Marketing/Sales/HR/Recruiter/Support/Finance) from a tech
  # candidate's recommendations. The candidate's own family is never excluded. Flag-gated for
  # instant rollback: false = no family-based exclusion (legacy behavior).
  industry:
    filter-enabled: ${JOB_INDUSTRY_FILTER:true}
  # ---- Candidate-signal source for job matching (Phase 1 single-source-of-truth) ----
  # false (default) = matcher reads candidate signals from the legacy WorkflowRun snapshot +
  # live candidate_preferences (pre-Phase-1 behavior, unchanged). true = matcher reads from the
  # canonical CandidateProfile (resolved by CandidateSignalResolver), falling back to legacy only
  # for users who have no profile row yet. Flip on AFTER profiles are backfilled; instant rollback.
  matching:
    profile-source-enabled: ${JOBS_MATCHING_PROFILE_SOURCE_ENABLED:false}
    # When true, the matcher scores against the AI-enriched normalized_skills (job_ai_enrichment)
    # instead of the raw, often-generic provider jobs.skills column, for any job that has an
    # enrichment row — so prose-only listings match a candidate on their real tech stack. Falls back
    # to the raw skills for unenriched jobs. Requires JOBS_ENRICH_AI_ENABLED to have populated
    # enrichment. Default off; instant rollback.
    use-enrichment: ${JOBS_MATCHING_USE_ENRICHMENT:false}
    # Pre-gate: reject a job before full scoring if role similarity is below this (0-100).
    # Lowered from 40 → 10: a candidate with many skills needs fewer to appear in the job
    # description to clear the pre-gate; the 3-factor strict gate is the real quality filter.
    role-relevance-min: ${JOBS_MATCHING_ROLE_RELEVANCE_MIN:10}
    # Upper bound for the skill-ratio denominator. A thorough JD names many skill families;
    # without a cap, matched/allJobFamilies shrinks the more detailed the posting is, so strong
    # overlap on a rich JD scored LOWER than weak overlap on a thin one (real, relevant roles
    # landed at 68-69, just under the 70 gate). Cap treats a job as needing at most N core
    # families. Set very high (e.g. 999) to restore the old uncapped behavior (instant rollback).
    skill-denom-cap: ${JOBS_MATCHING_SKILL_DENOM_CAP:8}
    # ---- Phase 2B-5: mandatory preference hard-reject (Step 6) ----
    # Today work-mode/location/visa are soft weights only (1-10% of the score), so a job that
    # structurally cannot work for the candidate (e.g. onsite when they set "Remote only") can still
    # clear the gate on strong skills alone. When true, PreferenceGate rejects such jobs outright,
    # before scoring — only on an EXPLICIT signal (a stated preference + a known, conflicting job
    # field); never on missing/unknown data. Default off; instant rollback. See PreferenceGate.java.
    hard-preference-enabled: ${JOB_HARD_PREFERENCE_ENABLED:false}
    # ---- Phase 2B-3: MatchCache (Step 11) ----
    # Skips the rescore + persist cycle in refreshForUser when nothing changed (same resume/profile
    # version AND same discovered-pool version) since the last refresh, within a 24h TTL. Activates
    # the provisioned-but-unused Redis. Fails open (always a miss) if Redis is unreachable — never
    # serves a stale read on a cache error. Default off; instant rollback. See MatchCache.java.
    cache-enabled: ${JOB_MATCH_CACHE_ENABLED:false}
  recommendation:
    v2-enabled: ${JOB_RECO_V2_ENABLED:true}      # gate Recommended on score+confidence
    threshold: ${JOB_RECO_THRESHOLD:70}          # min match score for Recommended + Browse boundary (spec: 70)
    # Full-spec Recommended gate: score >= gate-min-score AND >= 1 matched role family AND
    # >= gate-min-skills matched skill families. false = legacy top-N-by-score (instant rollback).
    strict-gate-enabled: ${JOB_RECO_STRICT_GATE:true}
    gate-min-score: ${JOB_RECO_GATE_MIN_SCORE:70}
    gate-min-skills: ${JOB_RECO_GATE_MIN_SKILLS:3}
    # ---- Phase 2B-1 / 2C-2: action categorization (Step 7 → refined Step 2) ----
    # Buckets each persisted recommendation by its match score into a 5-tier action category
    # (AUTO_APPLY_READY >=95, HIGH_PRIORITY 90-94, HUMAN_REVIEW 80-89, RECOMMENDED 70-79, else ARCHIVED)
    # and a cross-cutting MUST_APPLY flag. Pure function of the score/breakdown — no re-score, no LLM.
    # Default off → category/must_apply stay NULL, zero behavior change.
    auto-categorization-enabled: ${JOB_AUTO_CATEGORIZATION_ENABLED:false}
    # ---- Phase 2C-1: priority engine (Step 4) ----
    # Computes a separate priority band (CRITICAL/HIGH/MEDIUM/LOW) = match score + additive bonuses
    # (visa/remote/exact-role/salary/recent). A distinct ranking dimension; never re-orders the existing
    # match-score-ordered Recommended list. Default off → priority stays NULL, zero behavior change.
    priority-enabled: ${RECOMMENDATION_PRIORITY_ENABLED:false}
  explain:
    enabled: ${JOB_EXPLAIN_ENABLED:true}         # "Why am I a match?" LLM endpoint
  # ---- Phase 3B.1: career-relevance keyword configuration (ai.careerpilot.discovery.relevance) ----
  # Comma-separated keyword overrides for RoleFamilyResolver/DomainPreferenceService. All optional —
  # each has a sensible built-in default matching the Phase 3B.1 spec's example mappings.
  relevance:
    role-family:
      java-backend: ${JOB_RELEVANCE_JAVA_BACKEND_TITLES:}
      data-engineering: ${JOB_RELEVANCE_DATA_ENGINEERING_TITLES:}
      devops: ${JOB_RELEVANCE_DEVOPS_TITLES:}
      frontend: ${JOB_RELEVANCE_FRONTEND_TITLES:}
    excluded-domains: ${JOB_RELEVANCE_EXCLUDED_DOMAINS:}
  discovery:
    enabled: ${JOB_DISCOVERY_ENABLED:true}
    # When true, Domestic/International tabs derive their country set from the candidate's own
    # profile (home country / preferred countries) instead of the client-supplied country param,
    # and user-excluded roles are filtered out. Default off → legacy behavior, instant rollback.
    scope-strict-enabled: ${JOBS_DISCOVERY_SCOPE_STRICT_ENABLED:false}
    # Daily at 06:00. Tighten to hourly later ("0 0 * * * *") with no code change.
    cron: ${JOB_DISCOVERY_CRON:0 0 6 * * *}
    # Optional second cadence: a separate @Scheduled method on the same JobDiscoveryScheduler
    # (not a second scheduler class), off by default. Flip on for near-real-time discovery
    # without touching the daily cron above.
    hourly:
      enabled: ${JOB_DISCOVERY_HOURLY_ENABLED:false}
      cron: ${JOB_DISCOVERY_HOURLY_CRON:0 0 * * * *}
    user-agent: ${JOB_DISCOVERY_USER_AGENT:CareerPilotAI/1.0 (+https://careerpilot.ai)}
    providers:
      remoteok:
        base-url: ${REMOTEOK_BASE_URL:https://remoteok.com}
      arbeitnow:
        base-url: ${ARBEITNOW_BASE_URL:https://www.arbeitnow.com}
      adzuna:
        base-url: ${ADZUNA_BASE_URL:https://api.adzuna.com}
        app-id: ${ADZUNA_APP_ID:}
        app-key: ${ADZUNA_APP_KEY:}
        countries: ${ADZUNA_COUNTRIES:gb,us,in}
        results-per-page: ${ADZUNA_RESULTS_PER_PAGE:50}
      jooble:
        base-url: ${JOOBLE_BASE_URL:https://jooble.org}
        api-key: ${JOOBLE_API_KEY:}
        keywords: ${JOOBLE_KEYWORDS:software engineer,data engineer}
    # ---- Phase 2A: Enterprise Job Lake (SHADOW pipeline) ----
    # Additive, layered discovery (job_raw → job_normalized → job_lake) that runs ALONGSIDE the
    # legacy discovery above and NEVER writes into the `jobs` table. Ships DARK: every flag below
    # defaults false → no rows written, no scheduled run, zero behavior change until explicitly on.
    # NOTE: the master flag is JOB_LAKE_DISCOVERY_ENABLED, NOT JOB_DISCOVERY_ENABLED — the latter is
    # already bound to the LEGACY pipeline above (jobs.discovery.enabled), and reusing it would turn
    # the live pipeline off. Distinct name = no regression.
    lake:
      enabled: ${JOB_LAKE_DISCOVERY_ENABLED:false}
      # Daily at 02:00 UTC (zone pinned in the scheduler). Separate from the legacy 06:00 cron.
      cron: ${JOB_LAKE_DISCOVERY_CRON:0 0 2 * * *}
      # Deterministic (AI-free) dedup over job_normalized → job_duplicate_mapping. Default off.
      dedup-enabled: ${JOB_DISCOVERY_DEDUP_ENABLED:false}
      # Min title-token Jaccard to confirm a same-(country,city) candidate is the same posting.
      dedup-title-threshold: ${JOB_LAKE_DEDUP_TITLE_THRESHOLD:0.6}
      # Software-only pre-store gate (reuses JobTaxonomy). Off → store everything (Step 9). Default off.
      software-filter-enabled: ${JOB_SOFTWARE_FILTER_ENABLED:false}

# ---- Phase 2C Recommendation Intelligence (human approval + feedback) ----
# All default DARK — endpoints inert / no rows written until explicitly enabled.
recommendation:
  approval:
    # Gates the /api/recommendations approve|reject|save|archive endpoints, which write to the
    # existing Application entity (reuse, not a parallel queue). Off → those endpoints return 404.
    enabled: ${RECOMMENDATION_APPROVAL_ENABLED:false}
  feedback:
    # Gates recommendation feedback capture (Step 6): the POST /feedback endpoint AND the automatic
    # capture from an approve/reject/save/archive decision. Off → no rows written, decisions still work.
    # Feeds the 2C-5 candidate_behavior_profile.
    enabled: ${RECOMMENDATION_FEEDBACK_ENABLED:false}

# ---- Phase 2D.1 Resume Tailoring Engine ----
# All default DARK — endpoints return 404 / worker no-ops until explicitly enabled. The original
# resume (resumes.s3_key / parsed_text) is never modified; every generation is a new immutable
# resume_tailoring row. Never runs synchronously inside RecommendationDecisionService.decide() —
# approval publishes RecommendationApprovedEvent, consumed async/after-commit by
# ResumeTailoringWorker, so tailoring latency/failures can never affect the approval response.
resume:
  # ---- Phase 7.2/7.3 Resume Selection + autopilot tailoring trigger (dark) ----
  selection:
    enabled: ${RESUME_SELECTION_ENABLED:false}
    ats-floor: ${RESUME_SELECTION_ATS_FLOOR:70}
  autopilot:
    enabled: ${RESUME_AUTOPILOT_ENABLED:false}
  tailoring:
    # Master switch for the engine itself (manual POST /api/resume/tailor + GET endpoints).
    enabled: ${RESUME_TAILORING_ENABLED:false}
    # Redis-backed cache keyed on (user, resume version, job version, profile version), 7-day TTL.
    # Independent of the master switch so caching behavior can be validated separately.
    cache-enabled: ${RESUME_TAILORING_CACHE_ENABLED:false}
    trigger-on-approve:
      # Separate flag: lets the engine be manually testable via the API before the approve-flow
      # auto-trigger (RecommendationApprovedEvent -> ResumeTailoringWorker) is turned on.
      enabled: ${RESUME_TAILORING_TRIGGER_ON_APPROVE_ENABLED:false}
    min-length-chars: ${RESUME_TAILORING_MIN_LENGTH:800}
    max-length-chars: ${RESUME_TAILORING_MAX_LENGTH:20000}
    # Phase 2D.1.1 — bounded pool for the async job pipeline (ResumeTailoringJobService), separate
    # from the app-wide default @Async executor. Small on purpose: each task holds an LLM call for
    # up to ~2 minutes under provider degradation (see the Phase 2D.1 sign-off's P95 finding).
    executor:
      core-pool-size: ${RESUME_TAILORING_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${RESUME_TAILORING_EXECUTOR_MAX_POOL_SIZE:5}
      queue-capacity: ${RESUME_TAILORING_EXECUTOR_QUEUE_CAPACITY:50}
    # Phase 2D.1.1 — per-call provider preference passed to AiGatewayService.chat(...,
    # preferredProviders), tried before the rest of the default ai.gateway.order chain. Gemini
    # first by default: the live sign-off found DeepSeek's 20s-per-attempt timeout + circuit-breaker
    # cascade was the dominant cost in every sampled tailoring generation (P95 ~117s). Empty list
    # falls back to the default gateway order unchanged.
    preferred-providers: ${RESUME_TAILORING_PREFERRED_PROVIDERS:gemini,groq,deepseek,qwen,openrouter}
  # ---- Phase 8.2 Resume Intelligence Center ----
  # Purely an orchestration/status layer over the existing CandidateProfileService extraction
  # pipeline — no new parsing logic. Ships DARK: enabled=false -> the /api/resumes/{id}/analyze,
  # /reanalyze, /status, /analysis, /history, and /intelligence/dashboard endpoints all return 404,
  # zero behavior change to existing resume upload/analysis until explicitly flipped on.
  intelligence:
    center:
      enabled: ${RESUME_INTELLIGENCE_CENTER_ENABLED:false}

# ---- Phase 2D.2 ATS Optimization Engine ----
# Analyzes the LATEST tailored resume (from 2D.1) against its job: a deterministic ATS score
# (reuses ResumeImprovementCalculator) plus LLM-generated matched/missing keywords and
# optimization suggestions. Async job pipeline from day one (see resume.tailoring.executor's
# comment for why) — no synchronous version ever shipped. All default DARK.
ats:
  optimization:
    enabled: ${ATS_OPTIMIZATION_ENABLED:false}
    trigger-on-tailoring:
      # Separate flag: auto-triggers on ResumeTailoredEvent (published once a tailoring succeeds).
      # Independent of `enabled` so the engine stays manually testable via the API first.
      enabled: ${ATS_OPTIMIZATION_TRIGGER_ON_TAILORING_ENABLED:false}
    executor:
      core-pool-size: ${ATS_OPTIMIZATION_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${ATS_OPTIMIZATION_EXECUTOR_MAX_POOL_SIZE:5}
      queue-capacity: ${ATS_OPTIMIZATION_EXECUTOR_QUEUE_CAPACITY:50}
    # No new provider-routing env var — reuses the existing ai.gateway.routing.atsOptimization
    # list above (previously loaded-but-unused smart-router scaffolding).

# ---- Phase 2D.3 Gap Analysis Engine (deterministic, non-LLM) ----
# Triggered by AtsOptimizedEvent. All default DARK. Cache is versioned on (tailoringId,
# atsAnalysisId), 7-day TTL, fail-open (deterministic recompute is always safe).
gap:
  analysis:
    enabled: ${GAP_ANALYSIS_ENABLED:false}
    trigger:
      enabled: ${GAP_ANALYSIS_TRIGGER_ENABLED:false}
    cache-enabled: ${GAP_ANALYSIS_CACHE_ENABLED:true}
    executor:
      core-pool-size: ${GAP_ANALYSIS_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${GAP_ANALYSIS_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${GAP_ANALYSIS_EXECUTOR_QUEUE_CAPACITY:100}

# ---- Phase 2D.4 ATS Explainability Engine (deterministic, non-LLM) ----
# Triggered by GapAnalysisCompletedEvent. All default DARK.
ats.explainability:
  enabled: ${ATS_EXPLAINABILITY_ENABLED:false}
  trigger:
    enabled: ${ATS_EXPLAINABILITY_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${ATS_EXPLAINABILITY_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${ATS_EXPLAINABILITY_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${ATS_EXPLAINABILITY_EXECUTOR_QUEUE_CAPACITY:100}

# ---- Phase 2D.5 Cover Letter Engine (LLM-backed, validator-guarded) ----
# Triggered by AtsExplainabilityCompletedEvent. All default DARK. Validator rejects fabricated
# credential claims and letters that don't name the target company.
cover:
  letter:
    enabled: ${COVER_LETTER_ENABLED:false}
    trigger:
      enabled: ${COVER_LETTER_TRIGGER_ENABLED:false}
    cache-enabled: ${COVER_LETTER_CACHE_ENABLED:true}
    min-length-chars: ${COVER_LETTER_MIN_LENGTH:300}
    max-length-chars: ${COVER_LETTER_MAX_LENGTH:6000}
    executor:
      core-pool-size: ${COVER_LETTER_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${COVER_LETTER_EXECUTOR_MAX_POOL_SIZE:5}
      queue-capacity: ${COVER_LETTER_EXECUTOR_QUEUE_CAPACITY:50}

# ---- Phase 2D.6 Application Package Builder (deterministic assembly by reference) ----
# Triggered by CoverLetterCompletedEvent. All default DARK.
application:
  package:
    enabled: ${APPLICATION_PACKAGE_ENABLED:false}
    trigger:
      enabled: ${APPLICATION_PACKAGE_TRIGGER_ENABLED:false}
    cache-enabled: ${APPLICATION_PACKAGE_CACHE_ENABLED:true}
    executor:
      core-pool-size: ${APPLICATION_PACKAGE_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${APPLICATION_PACKAGE_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${APPLICATION_PACKAGE_EXECUTOR_QUEUE_CAPACITY:100}
    # ---- Phase 7.11 Application Package Intelligence (validation / canonical source of truth; dark) ----
    # validation.enabled gates the engine; validation.trigger.enabled chains it onto ApplicationPackageReadyEvent.
    validation:
      enabled: ${APPLICATION_PACKAGE_VALIDATION_ENABLED:false}
      trigger:
        enabled: ${APPLICATION_PACKAGE_VALIDATION_TRIGGER_ENABLED:false}
      require-learning: ${APPLICATION_PACKAGE_VALIDATION_REQUIRE_LEARNING:false}
      executor:
        core-pool-size: ${APPLICATION_PACKAGE_VALIDATION_EXECUTOR_CORE_POOL_SIZE:2}
        max-pool-size: ${APPLICATION_PACKAGE_VALIDATION_EXECUTOR_MAX_POOL_SIZE:4}
        queue-capacity: ${APPLICATION_PACKAGE_VALIDATION_EXECUTOR_QUEUE_CAPACITY:200}
    history:
      enabled: ${APPLICATION_PACKAGE_HISTORY_ENABLED:false}
    diagnostics:
      enabled: ${APPLICATION_PACKAGE_DIAGNOSTICS_ENABLED:false}
  # ---- Phase 7.12 AI Review Pipeline (final quality gate; reviews the 7.11 package; dark) ----
  # review.enabled gates the pipeline; review.trigger.enabled chains it onto ApplicationPackageValidatedEvent.
  # Each reviewer has its own flag so they can be canaried one at a time.
  review:
    enabled: ${APPLICATION_REVIEW_ENABLED:false}
    trigger:
      enabled: ${APPLICATION_REVIEW_TRIGGER_ENABLED:false}
    resume:
      enabled: ${APPLICATION_REVIEW_RESUME_ENABLED:false}
    ats:
      enabled: ${APPLICATION_REVIEW_ATS_ENABLED:false}
    company:
      enabled: ${APPLICATION_REVIEW_COMPANY_ENABLED:false}
    learning:
      enabled: ${APPLICATION_REVIEW_LEARNING_ENABLED:false}
    consistency:
      enabled: ${APPLICATION_REVIEW_CONSISTENCY_ENABLED:false}
    quality:
      enabled: ${APPLICATION_REVIEW_QUALITY_ENABLED:false}
    diagnostics:
      enabled: ${APPLICATION_REVIEW_DIAGNOSTICS_ENABLED:false}
    executor:
      core-pool-size: ${APPLICATION_REVIEW_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${APPLICATION_REVIEW_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${APPLICATION_REVIEW_EXECUTOR_QUEUE_CAPACITY:200}
  # ---- Phase 7.1 Application Decision Engine (deterministic; dark) ----
  decision:
    enabled: ${APPLICATION_DECISION_ENABLED:false}
    auto-apply-min-score: ${APPLICATION_DECISION_AUTO_APPLY_MIN_SCORE:90}
    review-min-score: ${APPLICATION_DECISION_REVIEW_MIN_SCORE:75}
    save-min-score: ${APPLICATION_DECISION_SAVE_MIN_SCORE:60}
    ats-floor: ${APPLICATION_DECISION_ATS_FLOOR:70}
    failure-penalty-cap: ${APPLICATION_DECISION_FAILURE_PENALTY_CAP:-20}
  # ---- Phase 7.4 Auto Apply Engine (fail-safe; no provider integration; dark) ----
  auto:
    enabled: ${APPLICATION_AUTO_ENABLED:false}

# ---- Phase 2D.7 Auto Apply Package Preparation (deterministic; PREPARATION ONLY, no automation) ----
# Triggered by ApplicationPackageReadyEvent. All default DARK.
auto:
  apply:
    package:
      enabled: ${AUTO_APPLY_PACKAGE_ENABLED:false}
    trigger:
      enabled: ${AUTO_APPLY_TRIGGER_ENABLED:false}
    executor:
      core-pool-size: ${AUTO_APPLY_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${AUTO_APPLY_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${AUTO_APPLY_EXECUTOR_QUEUE_CAPACITY:100}

# ==== Phase 2E — Enterprise Auto-Apply Execution Engine (HIGH RISK) ====
# The entire execution platform ships DARK and INERT. With these defaults nothing submits an
# application and nothing auto-starts off 2D output: the safety/approval GATES default enabled=true
# (they must never be skippable when the pipeline runs), but every pipeline-ENTRY trigger defaults
# false, so completing a 2D pipeline creates ZERO 2E rows. Browser automation is a throwing stub with
# no Playwright dependency; every ATS connector is unconfigured. Enabling is a separate, later,
# human-gated decision. NEVER flip execution/browser/ats/*_trigger on without the rollout plan.
# NOTE: dotted top-level keys (like the existing `ats.explainability:`) so these don't collide with
# the Phase-2D `application:` / `ats:` blocks above — Spring relaxed-binding flattens both forms.
application.execution:
  enabled: ${APPLICATION_EXECUTION_ENABLED:false}
  trigger:
    # Fires ApplicationExecutionWorker off a human-published ApprovalGrantedEvent only.
    enabled: ${APPLICATION_EXECUTION_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${APPLICATION_EXECUTION_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${APPLICATION_EXECUTION_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${APPLICATION_EXECUTION_EXECUTOR_QUEUE_CAPACITY:50}
application.approval:
  # Human approval is MANDATORY (default true). Disabling does NOT create an auto-approve path —
  # it only stops enqueueing new approval requests. There is no AUTO_APPROVE in this version.
  enabled: ${APPLICATION_APPROVAL_ENABLED:true}
application.safety:
  # The safety GATE itself (default on — never skippable). A disabled gate is a CLOSED gate.
  enabled: ${APPLICATION_SAFETY_ENABLED:true}
  trigger:
    # The pipeline ENTRY. Default false: SafetyValidationWorker does NOT auto-fire off
    # ApplicationPackageReadyEvent until this is explicitly flipped.
    enabled: ${APPLICATION_SAFETY_TRIGGER_ENABLED:false}
  ats-min-score: ${APPLICATION_SAFETY_ATS_MIN_SCORE:60}
  gap-max-score: ${APPLICATION_SAFETY_GAP_MAX_SCORE:60}
  blacklist-companies: ${APPLICATION_SAFETY_BLACKLIST_COMPANIES:}
application.retry:
  max-attempts: ${APPLICATION_RETRY_MAX_ATTEMPTS:3}
  base-backoff-ms: ${APPLICATION_RETRY_BASE_BACKOFF_MS:1000}
# ---- Phase 7.16.3: Automation Recovery & Retry Center (ships DARK) ----
# Glue over the existing RetryPolicyService/ApplicationRetry (Phase 2E.6, built but never invoked
# until now) and SubmissionVerificationService (7.16.1) — no new retry engine, no new workflow, no
# new browser layer. `enabled` gates AutomationRecoveryService#attemptRecovery: with it false,
# ApplicationExecutionService's failure paths are byte-for-byte unchanged (every FAILED stays
# FAILED, nothing is ever classified/parked). `trigger.enabled` gates RecoveryScheduler's poll of
# due RETRY rows — separate from `enabled` so recovery decisions can be recorded/observed before
# the auto-requeue poller is trusted to fire.
application.recovery:
  enabled: ${APPLICATION_RECOVERY_ENABLED:false}
  trigger:
    enabled: ${APPLICATION_RECOVERY_TRIGGER_ENABLED:false}
  poll-interval-ms: ${APPLICATION_RECOVERY_POLL_INTERVAL_MS:30000}
browser.recovery:
  session-restart:
    # Gates AutomationRecoveryService's zombie-triggered BrowserSessionManager#restartIfZombie()
    # call on a BROWSER_FAILURE classification. Independent of application.recovery.enabled so the
    # (higher-risk) browser-process restart can stay off even after recovery decisions are trusted.
    enabled: ${BROWSER_RECOVERY_SESSION_RESTART_ENABLED:false}
# Phase 7.16.4 — Application Operations Center. Purely a read-only aggregation over existing
# execution/retry/verification/recovery data (OperationsService) — no new persistence. Gates both
# the global diagnostics/operations/* endpoints and the per-application executions/{id}/detail|
# explain|evidence|timeline-export|manual-review endpoints. Independent of application.recovery.*
# since observability should be toggleable without touching the recovery engine itself.
application.operations:
  enabled: ${APPLICATION_OPERATIONS_ENABLED:false}
application.tracking:
  enabled: ${APPLICATION_TRACKING_ENABLED:false}
  trigger:
    enabled: ${APPLICATION_TRACKING_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${APPLICATION_TRACKING_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${APPLICATION_TRACKING_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${APPLICATION_TRACKING_EXECUTOR_QUEUE_CAPACITY:100}
application.analytics:
  enabled: ${APPLICATION_ANALYTICS_ENABLED:false}
  trigger:
    enabled: ${APPLICATION_ANALYTICS_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${APPLICATION_ANALYTICS_EXECUTOR_CORE_POOL_SIZE:1}
    max-pool-size: ${APPLICATION_ANALYTICS_EXECUTOR_MAX_POOL_SIZE:2}
    queue-capacity: ${APPLICATION_ANALYTICS_EXECUTOR_QUEUE_CAPACITY:100}
browser.automation:
  # Gap D — REAL headless-Chromium engine (Playwright), lazily launched only on first use. Still
  # defaults false: nothing launches a browser process until this is explicitly flipped on, AND
  # even then only Greenhouse/Lever (guest-apply-eligible, see GuestApplyEligibility — hardcoded,
  # not flag-controlled) ever reach the real path; every other connector still resolves to ABORTED
  # exactly as before Gap D.
  enabled: ${BROWSER_AUTOMATION_ENABLED:false}
  # Diagnostics-visibility only (same precedent as WellfoundProvider#isFlagEnabled) — the actual
  # guest-apply-only enforcement is a hardcoded connector allowlist (GuestApplyEligibility), NOT
  # this flag, and this flag must not be made configurable to false.
  guest-apply-only: ${BROWSER_AUTOMATION_GUEST_APPLY_ONLY:true}
  executor:
    core-pool-size: ${BROWSER_AUTOMATION_EXECUTOR_CORE_POOL_SIZE:1}
    max-pool-size: ${BROWSER_AUTOMATION_EXECUTOR_MAX_POOL_SIZE:2}
    queue-capacity: ${BROWSER_AUTOMATION_EXECUTOR_QUEUE_CAPACITY:20}
ats.connector:
  # Greenhouse/Lever now real (Gap D, gated by browser.automation.enabled + GuestApplyEligibility);
  # every other connector remains an unconfigured stub whose submit() throws.
  enabled: ${ATS_CONNECTOR_ENABLED:false}
  executor:
    core-pool-size: ${ATS_CONNECTOR_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${ATS_CONNECTOR_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${ATS_CONNECTOR_EXECUTOR_QUEUE_CAPACITY:50}

# ---- Phase 3A: Enterprise Application Tracking Workflow (ships DARK) ----
# Event-driven workflow (NOT a linear pipeline) that tracks an application AFTER it exists:
# Applied -> Viewed -> Assessment -> Interview -> Offer -> Accepted/Rejected. Isolated in the
# ai.careerpilot.workflow bounded context with its own `workflow.*` flag namespace so Phase 2E stays
# byte-for-byte untouched (2E owns application.tracking.*/application.analytics.* above). Every stage
# has TWO flags: `<stage>.enabled` gates the engine itself; `<stage>.trigger.enabled` gates whether it
# auto-fires off the prior stage's event. ALL default false: with stock flags the WorkflowEntryBridge
# mints nothing, so creating an application produces ZERO Phase 3A rows. Migrations V36-V43 are written
# but NOT applied. Enabling is a separate, later, human-gated decision — canary one stage at a time,
# engine-enabled first (verify via /api/diagnostics/<stage>), then trigger-enabled. Dotted top-level
# keys (like `ats.explainability:`) so relaxed-binding flattens them without colliding.
workflow.tracking:
  # 3A.1 lifecycle state machine (also gates StatusDetectionWorker). Entry gate for the whole workflow.
  enabled: ${WORKFLOW_TRACKING_ENABLED:false}
  trigger:
    enabled: ${WORKFLOW_TRACKING_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${WORKFLOW_TRACKING_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${WORKFLOW_TRACKING_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${WORKFLOW_TRACKING_EXECUTOR_QUEUE_CAPACITY:100}
workflow.status-detection:
  # StatusDetectionWorker shares workflow.tracking.* flags; it needs only its own dedicated executor.
  executor:
    core-pool-size: ${WORKFLOW_STATUS_DETECTION_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${WORKFLOW_STATUS_DETECTION_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${WORKFLOW_STATUS_DETECTION_EXECUTOR_QUEUE_CAPACITY:100}
workflow.timeline:
  # 3A.2 append-only timeline.
  enabled: ${WORKFLOW_TIMELINE_ENABLED:false}
  trigger:
    enabled: ${WORKFLOW_TIMELINE_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${WORKFLOW_TIMELINE_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${WORKFLOW_TIMELINE_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${WORKFLOW_TIMELINE_EXECUTOR_QUEUE_CAPACITY:100}

# ---- Phase 7.16: Real Application Submission Pipeline (ships DARK) ----
# A thin orchestration layer over the existing dormant execution/packageintel/review/companyintel/
# story modules — see ai.careerpilot.submission package Javadoc. Deliberately a different namespace
# (`application.submission.*`) from the existing `application.execution.*`/`application.approval.*`
# so there's no collision (same dotted-top-level-key convention as `application.execution:` above).
# All default false: with stock flags the Apply button behaves byte-for-byte as it does today.
application.submission:
  enabled: ${APPLICATION_SUBMISSION_ENABLED:false}
  auto:
    enabled: ${APPLICATION_SUBMISSION_AUTO_ENABLED:false}
  manual:
    enabled: ${APPLICATION_SUBMISSION_MANUAL_ENABLED:false}
  approval:
    enabled: ${APPLICATION_SUBMISSION_APPROVAL_ENABLED:false}
  diagnostics:
    enabled: ${APPLICATION_SUBMISSION_DIAGNOSTICS_ENABLED:false}
  executor:
    core-pool-size: ${APPLICATION_SUBMISSION_EXECUTOR_CORE:2}
    max-pool-size: ${APPLICATION_SUBMISSION_EXECUTOR_MAX:4}
    queue-capacity: ${APPLICATION_SUBMISSION_EXECUTOR_QUEUE:50}
email.intelligence:
  # 3A.3 INERT deterministic keyword classifier — no live mailbox, no external fetch, no LLM.
  enabled: ${EMAIL_INTELLIGENCE_ENABLED:false}
  trigger:
    enabled: ${EMAIL_INTELLIGENCE_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${EMAIL_INTELLIGENCE_EXECUTOR_CORE_POOL_SIZE:1}
    max-pool-size: ${EMAIL_INTELLIGENCE_EXECUTOR_MAX_POOL_SIZE:2}
    queue-capacity: ${EMAIL_INTELLIGENCE_EXECUTOR_QUEUE_CAPACITY:100}
interview.tracking:
  # 3A.4 interview rounds (gates both InterviewDetectionWorker and InterviewTrackingWorker).
  enabled: ${INTERVIEW_TRACKING_ENABLED:false}
  trigger:
    enabled: ${INTERVIEW_TRACKING_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${INTERVIEW_TRACKING_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${INTERVIEW_TRACKING_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${INTERVIEW_TRACKING_EXECUTOR_QUEUE_CAPACITY:100}
workflow.analytics:
  # 3A.5 outcome analytics (gates both OfferDetectionWorker and AnalyticsWorker). Uses the
  # careerAnalyticsExecutor bean — deliberately NOT 2E's analyticsExecutor.
  enabled: ${WORKFLOW_ANALYTICS_ENABLED:false}
  trigger:
    enabled: ${WORKFLOW_ANALYTICS_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${WORKFLOW_ANALYTICS_EXECUTOR_CORE_POOL_SIZE:1}
    max-pool-size: ${WORKFLOW_ANALYTICS_EXECUTOR_MAX_POOL_SIZE:2}
    queue-capacity: ${WORKFLOW_ANALYTICS_EXECUTOR_QUEUE_CAPACITY:100}
career.intelligence:
  # 3A.6 deterministic (no-LLM) career probabilities. Terminal stage — publishes nothing further.
  enabled: ${CAREER_INTELLIGENCE_ENABLED:false}
  trigger:
    enabled: ${CAREER_INTELLIGENCE_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${CAREER_INTELLIGENCE_EXECUTOR_CORE_POOL_SIZE:1}
    max-pool-size: ${CAREER_INTELLIGENCE_EXECUTOR_MAX_POOL_SIZE:2}
    queue-capacity: ${CAREER_INTELLIGENCE_EXECUTOR_QUEUE_CAPACITY:100}

# ---- Phase 3B.1: Career-Relevant Domestic/International Job Feed Engine ----
# Converts Domestic/International from location-only feeds into career-aware feeds (role + skill +
# experience + domain relevance >= 70), while Browse stays the unfiltered "everything" tab. Ships
# fully DARK: all four flags default false. career.relevance.enabled is the master switch (read by
# CareerRelevanceEvaluator); the two per-scope filter flags are read by JobService.discovered and
# only take effect when the master flag is also on, so Domestic and International can be canaried
# independently. career.explainability.enabled gates GET /api/jobs/{id}/relevance (404 when off).
# See docs/PHASE_3B_1.md, docs/PHASE_3B_1_FILTER_RULES.md, docs/PHASE_3B_1_ROLLBACK.md.
#
# ---- Phase 3B.1.1: Soft Relevance Threshold Engine ----
# Replaces the flat "score < 70 => reject" cutoff with per-feed bands (CareerThresholdPolicy),
# gated by career.soft-thresholds.enabled (default false). While off, CareerThresholdPolicy
# reproduces the exact legacy >=70 cutoff, so Domestic/International behavior is unchanged until
# this flag is explicitly flipped. career.relevance.thresholds.* configures the per-feed cutoffs
# (recommended/domestic/international/hidden) used only once the flag is on.
# See docs/PHASE_3B_1_1.md, docs/PHASE_3B_1_1_THRESHOLD_POLICY.md, docs/PHASE_3B_1_1_MATCH_STRENGTH.md.
career:
  # ---- Phase 7.10 Career Orchestrator (autonomous apply-side pipeline; dark) ----
  orchestrator:
    enabled: ${CAREER_ORCHESTRATOR_ENABLED:false}
    cron: ${CAREER_ORCHESTRATOR_CRON:0 30 2 * * *}
    max-per-user: ${CAREER_ORCHESTRATOR_MAX_PER_USER:25}
    executor:
      core-pool-size: ${CAREER_ORCHESTRATOR_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${CAREER_ORCHESTRATOR_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${CAREER_ORCHESTRATOR_EXECUTOR_QUEUE_CAPACITY:200}
  relevance:
    enabled: ${CAREER_RELEVANCE_ENABLED:false}
    thresholds:
      recommended: ${CAREER_THRESHOLD_RECOMMENDED:85}
      domestic: ${CAREER_THRESHOLD_DOMESTIC:60}
      international: ${CAREER_THRESHOLD_INTERNATIONAL:60}
      hidden: ${CAREER_THRESHOLD_HIDDEN:60}
  soft-thresholds:
    enabled: ${CAREER_SOFT_THRESHOLDS_ENABLED:false}
  domestic:
    filter:
      enabled: ${CAREER_DOMESTIC_FILTER_ENABLED:false}
  international:
    filter:
      enabled: ${CAREER_INTERNATIONAL_FILTER_ENABLED:false}
    # ---- International Job Discovery Engine, Phase 1 (dark by default) ----
    tiering:
      enabled: ${CAREER_INTERNATIONAL_TIERING_ENABLED:false}
    seniority-filter:
      enabled: ${CAREER_INTERNATIONAL_SENIORITY_FILTER_ENABLED:false}
    title-allowlist:
      enabled: ${CAREER_INTERNATIONAL_TITLE_ALLOWLIST_ENABLED:false}
    ranking:
      enabled: ${CAREER_INTERNATIONAL_RANKING_ENABLED:false}
  explainability:
    enabled: ${CAREER_EXPLAINABILITY_ENABLED:false}
  # ---- Job discovery: 2 new keyless-public-API providers, same shape/flag namespace as
  # career.discovery.greenhouse.*/career.discovery.lever.* (GreenhouseProvider/LeverProvider).
  # NOTE: neither greenhouse nor lever actually has an entry in this file today — both providers
  # read their @Value(...) defaults (enabled=false, empty board/company CSV) with nothing set here,
  # so this provider chain ships fully dark out of the box. Ashby/SmartRecruiters follow that same
  # convention: default `false`/empty via @Value, and this block exists only so the env var names
  # and shape are discoverable/documented in one place, matching the existing greenhouse/lever
  # naming (career.discovery.<name>.*) rather than the provider.<name>.enabled naming a since-revised
  # spec draft used — see CLAUDE.md-equivalent task notes for this explicit, intentional deviation.
  discovery:
    ashby:
      enabled: ${CAREER_DISCOVERY_ASHBY_ENABLED:false}
      base-url: ${CAREER_DISCOVERY_ASHBY_BASE_URL:https://api.ashbyhq.com}
      orgs: ${CAREER_DISCOVERY_ASHBY_ORGS:}
      throttle-ms: ${CAREER_DISCOVERY_ASHBY_THROTTLE_MS:300}
    smartrecruiters:
      enabled: ${CAREER_DISCOVERY_SMARTRECRUITERS_ENABLED:false}
      base-url: ${CAREER_DISCOVERY_SMARTRECRUITERS_BASE_URL:https://api.smartrecruiters.com}
      companies: ${CAREER_DISCOVERY_SMARTRECRUITERS_COMPANIES:}
      throttle-ms: ${CAREER_DISCOVERY_SMARTRECRUITERS_THROTTLE_MS:300}
    # ---- Phase 5.2: AI Dev Jobs is a real, working, keyless public API (verified). DevITjobs and
    # GraphQL Jobs ship as inert stubs — see their class javadocs for the dead-endpoint findings
    # (DevITjobs UK's old domain 302s to a JobCopilot signup page; graphql.jobs does not resolve in
    # DNS) — both always report unconfigured regardless of their flag, same as WellfoundProvider.
    ai-dev-jobs:
      enabled: ${CAREER_DISCOVERY_AI_DEV_JOBS_ENABLED:false}
      base-url: ${CAREER_DISCOVERY_AI_DEV_JOBS_BASE_URL:https://aidevboard.com}
      limit: ${CAREER_DISCOVERY_AI_DEV_JOBS_LIMIT:50}
    devitjobs:
      enabled: ${CAREER_DISCOVERY_DEVITJOBS_ENABLED:false}
    graphql-jobs:
      enabled: ${CAREER_DISCOVERY_GRAPHQL_JOBS_ENABLED:false}
    # ---- International Job Discovery Engine, Phase 1: architecture-ready dark stubs. None of the
    # three has a free/ToS-compliant public API — isConfigured() stays false unconditionally
    # regardless of this flag (diagnostics-only, see LinkedInProvider/IndeedProvider/GlassdoorProvider).
    linkedin:
      enabled: ${CAREER_DISCOVERY_LINKEDIN_ENABLED:false}
    indeed:
      enabled: ${CAREER_DISCOVERY_INDEED_ENABLED:false}
    glassdoor:
      enabled: ${CAREER_DISCOVERY_GLASSDOOR_ENABLED:false}
    # ---- Phase 5.3: Enterprise ATS Connector Framework. `enterprise.enabled` is the
    # framework-wide master switch, AND'd with each provider's own flag (so both must be true).
    # Workday is real (see WorkdayProvider javadoc); Taleo/SuccessFactors are connector
    # architecture only — always inert regardless of flags (see their class javadocs for why).
    enterprise:
      enabled: ${CAREER_DISCOVERY_ENTERPRISE_ENABLED:false}
    workday:
      enabled: ${CAREER_DISCOVERY_WORKDAY_ENABLED:false}
      # CSV of "tenant;cluster;site;displayName;country;industry;priority" entries — see
      # WorkdayCompanyConnector for the format. Empty by default: no companies hardcoded.
      companies: ${CAREER_DISCOVERY_WORKDAY_COMPANIES:}
      limit: ${CAREER_DISCOVERY_WORKDAY_LIMIT:50}
      throttle-ms: ${CAREER_DISCOVERY_WORKDAY_THROTTLE_MS:300}
      # Phase 5.3.1: bounded opt-in per-job detail GET for richer fields (real location,
      # description, employment type, apply URL...). 0 = off, exact Phase 5.3 behavior.
      detail-fetch-limit: ${CAREER_DISCOVERY_WORKDAY_DETAIL_FETCH_LIMIT:0}
    taleo:
      enabled: ${CAREER_DISCOVERY_TALEO_ENABLED:false}
      # CSV of "company;careerUrl;country;industry;priority" entries. Parsed but never fetched.
      companies: ${CAREER_DISCOVERY_TALEO_COMPANIES:}
    successfactors:
      enabled: ${CAREER_DISCOVERY_SUCCESSFACTORS_ENABLED:false}
      companies: ${CAREER_DISCOVERY_SUCCESSFACTORS_COMPANIES:}
    health:
      # Consecutive-failure cooldown before JobDiscoveryHealthTracker moves a provider's circuit
      # from OPEN to HALF_OPEN (diagnostics-only; does not gate actual fetch calls — see the
      # tracker's javadoc for why full Resilience4j wiring per job-provider is out of scope here).
      circuit-cooldown-ms: ${CAREER_DISCOVERY_HEALTH_CIRCUIT_COOLDOWN_MS:300000}
    # ---- Gap A: Company Discovery Agent probe sources (CompanySource impls). Base URLs mirror
    # the already-verified Greenhouse/Ashby/SmartRecruiters job-provider endpoints one level up
    # (career.discovery.greenhouse/ashby/smartrecruiters.*) — separate keys here since a probe
    # source is gated by the single company.discovery.enabled master flag below, not its own.
    company-agent:
      greenhouse:
        base-url: ${CAREER_DISCOVERY_COMPANY_AGENT_GREENHOUSE_BASE_URL:https://boards-api.greenhouse.io/v1}
      ashby:
        base-url: ${CAREER_DISCOVERY_COMPANY_AGENT_ASHBY_BASE_URL:https://api.ashbyhq.com}
      smartrecruiters:
        base-url: ${CAREER_DISCOVERY_COMPANY_AGENT_SMARTRECRUITERS_BASE_URL:https://api.smartrecruiters.com}
      # CSV of candidate slugs to probe. Greenhouse/Ashby/SmartRecruiters expect a flat slug (e.g.
      # "acme"); Workday expects "tenant;cluster;site" (see WorkdayCompanySource). Empty by
      # default — never a hardcoded company list, matching every other provider in this codebase.
      candidates: ${CAREER_DISCOVERY_COMPANY_AGENT_CANDIDATES:}
  # ---- Gap C — Career Coach roadmap persistence (V61, additive, dark) ----
  # Gates CareerRoadmapPersistenceService's parse+persist of the LangGraph career_strategy
  # agent's 3/6/12-month roadmap + skill_gaps into the existing career_strategy row. Reads never
  # require this flag — the UI section simply renders empty when nothing has been persisted yet.
  roadmap:
    persistence:
      enabled: ${CAREER_ROADMAP_PERSISTENCE_ENABLED:false}
  # ---- Phase 11.5 — Proactive Career Intelligence. See
  # ai.careerpilot.career.monitor.CareerMonitorConfig, the only reader of this block.
  # `enabled: false` (default) means none of that package's beans are constructed. Every
  # detector is a read-only wrapper around existing data (job recommendations, resume
  # age, career strategy JSON fields, offer vs. market percentile, interview schedule) —
  # no new query, no new table. Not called by any scheduler or controller yet.
  monitor:
    enabled: ${CAREER_MONITOR_ENABLED:false}
    job-match-score-threshold: ${CAREER_MONITOR_JOB_MATCH_SCORE_THRESHOLD:80}
    job-match-lookback-days: ${CAREER_MONITOR_JOB_MATCH_LOOKBACK_DAYS:7}
    job-match-max-alerts: ${CAREER_MONITOR_JOB_MATCH_MAX_ALERTS:5}
    resume-staleness-days: ${CAREER_MONITOR_RESUME_STALENESS_DAYS:90}
    interview-reminder-window-days: ${CAREER_MONITOR_INTERVIEW_REMINDER_WINDOW_DAYS:7}
    alert-cooldown-days: ${CAREER_MONITOR_ALERT_COOLDOWN_DAYS:7}
    recommendation-limit: ${CAREER_MONITOR_RECOMMENDATION_LIMIT:10}
  # ---- Phase 11.6 — Autonomous Career Agent. See
  # ai.careerpilot.career.agent.AutonomousCareerAgentConfig, the only reader of this
  # block. `enabled: false` (default) means none of that package's beans are
  # constructed. Task dispatch is deliberately deferred (never calls a real business
  # service — see DeferredAgentTaskExecutor's javadoc) and no @Scheduled bean exists —
  # nothing triggers AutonomousCareerAgent.runOnce automatically.
  agent:
    enabled: ${CAREER_AGENT_ENABLED:false}
    max-tasks-per-plan: ${CAREER_AGENT_MAX_TASKS_PER_PLAN:5}
    min-run-interval-hours: ${CAREER_AGENT_MIN_RUN_INTERVAL_HOURS:24}

# ---- Gap A: Company Discovery Agent (dark). Weekly, low-frequency background probe of
# Greenhouse/Ashby/SmartRecruiters/Workday's real keyless public endpoints for candidate company
# slugs (never a hardcoded company list — see career.discovery.company-agent.candidates above).
# Hits land in company_connectors with discovery_status=PENDING_APPROVAL, enabled=false, awaiting
# admin review via /api/company-discovery/{id}/approve|reject. Ships fully dark: enabled=false.
company:
  discovery:
    enabled: ${COMPANY_DISCOVERY_ENABLED:false}
    cron: ${COMPANY_DISCOVERY_CRON:0 0 5 * * MON}
    # Candidate slugs live at career.discovery.company-agent.candidates (see above) — kept under
    # the career.discovery.* namespace alongside every other discovery-provider CSV config, not
    # duplicated here.
    health:
      circuit-cooldown-ms: ${COMPANY_DISCOVERY_HEALTH_CIRCUIT_COOLDOWN_MS:300000}
  research:
    enabled: ${COMPANY_RESEARCH_ENABLED:false}
interview:
  prep:
    enabled: ${INTERVIEW_PREP_ENABLED:false}
calendar:
  integration:
    enabled: ${CALENDAR_INTEGRATION_ENABLED:false}

# ---- Data retention (Phase 3B prep) ----
# Additive, flag-gated purge of append-only ledgers that otherwise grow unbounded. DISABLED by
# default: with retention.enabled=false the daily scheduler fires but RetentionService is a no-op
# and deletes nothing. Each target has its own age window (days); correlations are purged only when
# terminal, so an in-flight workflow is never reaped. Manual trigger: POST /api/admin/retention/run
# (admin-role gated). Enable only after choosing per-target windows appropriate to your compliance needs.
retention:
  enabled: ${RETENTION_ENABLED:false}
  cron: ${RETENTION_CRON:0 30 3 * * *}
  workflow-dead-letter:
    days: ${RETENTION_WORKFLOW_DEAD_LETTER_DAYS:90}
  workflow-correlation:
    days: ${RETENTION_WORKFLOW_CORRELATION_DAYS:180}
  recommendation-audit:
    days: ${RETENTION_RECOMMENDATION_AUDIT_DAYS:365}
  execution-audit:
    days: ${RETENTION_EXECUTION_AUDIT_DAYS:365}
  resume-tailoring-audit:
    days: ${RETENTION_RESUME_TAILORING_AUDIT_DAYS:365}

# ---- Candidate Intelligence Profile (Phase 1) ----
# Canonical AI-analyzed profile = resume intelligence merged with a snapshot of
# candidate_preferences. Ships DARK: enabled=false → event listeners no-op and the
# /api/candidate-profile endpoints return 404, so there is zero behavior change until
# explicitly flipped on after validation. Consumed by job matching/discovery once the relevant
# downstream flag (jobs.matching.profile-source-enabled / candidate.profile.single-source-enabled)
# is also on.
candidate:
  profile:
    enabled: ${CANDIDATE_PROFILE_ENABLED:false}
    # Cap on resume characters sent to the LLM extraction (cost/latency guard).
    max-resume-chars: ${CANDIDATE_PROFILE_MAX_RESUME_CHARS:12000}
    backfill:
      # Pause between LLM extractions during the one-time enablement backfill, so generating
      # profiles for every existing user stays within the shared provider rate limits.
      throttle-ms: ${CANDIDATE_PROFILE_BACKFILL_THROTTLE_MS:500}
    # Phase 1.5 — when true, Domestic/International discovery and excluded-role filtering read the
    # canonical CandidateProfile (via CandidateSignalResolver.resolveLocationSignals), falling back
    # to live candidate_preferences for users with no profile row yet. Independent of
    # jobs.matching.profile-source-enabled (which only gates the Recommended-tab matcher) so the two
    # consumer groups can be migrated on separate schedules. Default off; instant rollback.
    single-source-enabled: ${PROFILE_SINGLE_SOURCE_ENABLED:false}
    rebuild:
      # Phase 1.5 — weekly catch-up rebuild for users whose cached extraction has drifted from their
      # latest resume (e.g. after a prompt/schema change). Reuses the same idempotent
      # needsBackfill/backfillUser fingerprint check as the one-time enablement backfill, so a
      # crashed run simply re-evaluates staleness next time. Default off; instant rollback.
      enabled: ${CANDIDATE_PROFILE_REBUILD_ENABLED:false}
      cron: ${CANDIDATE_PROFILE_REBUILD_CRON:0 0 2 ? * SUN}
      max-per-run: ${CANDIDATE_PROFILE_REBUILD_MAX_PER_RUN:200}
  recommendation:
    # Phase 1.5 — persists the per-job scoring breakdown (skill/role/preference/location/visa/salary/
    # final) from JobScoring.scoreV2 into recommendation_audit, for explainability. Purely additive
    # side effect after scoring; never affects the returned recommendation. Default off.
    audit-enabled: ${CANDIDATE_RECOMMENDATION_AUDIT_ENABLED:false}

# ---- Phase 7.15 STAR Story Intelligence & Behavioral AI (additive, dark) ----
# story.engine.enabled gates the orchestrating facade (StarStoryEngine); every sub-capability has
# its own flag so it can be canaried independently. story.worker.trigger.enabled chains automatic
# candidate-story drafting onto the existing Phase 6.1 LearningEventRecordedEvent. All default off.
story:
  engine:
    enabled: ${STORY_ENGINE_ENABLED:false}
  extraction:
    enabled: ${STORY_EXTRACTION_ENABLED:false}
  generation:
    enabled: ${STORY_GENERATION_ENABLED:false}
  recommendation:
    enabled: ${STORY_RECOMMENDATION_ENABLED:false}
  analytics:
    enabled: ${STORY_ANALYTICS_ENABLED:false}
  search:
    enabled: ${STORY_SEARCH_ENABLED:false}
  history:
    enabled: ${STORY_HISTORY_ENABLED:false}
  diagnostics:
    enabled: ${STORY_DIAGNOSTICS_ENABLED:false}
  worker:
    trigger:
      enabled: ${STORY_WORKER_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${STORY_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${STORY_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${STORY_EXECUTOR_QUEUE_CAPACITY:200}

# ---- Gap B — Offer Intelligence & Salary Negotiation (V61, additive, dark) ----
# Gates OfferAnalysisService's parse+persist of the LangGraph salary_intelligence agent's output
# into the offers table, plus OfferController's writes (reads degrade to empty list when off).
# Never generates legal/financial advice — informational/factual only (enforced in the Copilot
# system prompt, not by this flag).
offer:
  intelligence:
    enabled: ${OFFER_INTELLIGENCE_ENABLED:false}

logging:
  level:
    root: INFO
    ai.careerpilot: DEBUG