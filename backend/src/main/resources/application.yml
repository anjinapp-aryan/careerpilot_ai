spring:
  application:
    name: careerpilot-backend
  datasource:
    # DATABASE_URL is a JDBC URL. Neon credentials can be embedded as query
    # params (?user=...&password=...) so one var covers auth too; the
    # SPRING_DATASOURCE_USERNAME/PASSWORD vars below remain as an optional
    # override if you'd rather keep credentials out of the URL string.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/careerpilot}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc.lob.non_contextual_creation: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      # Single connection-string form: redis://[:password@]host:port, or
      # rediss://... for TLS (Upstash and most managed Redis require TLS).
      url: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Spring Boot autoconfigures the ProducerFactory (and reserves its buffer-memory)
      # at context startup regardless of careerpilot.kafka.enabled, since that flag only
      # gates whether WorkflowEventProducer publishes. Kafka's own default buffer-memory
      # is 32MB — trim it hard for memory-constrained deploys (e.g. Render free 512MB).
      buffer-memory: ${KAFKA_PRODUCER_BUFFER_MEMORY:1048576}
      properties:
        max.block.ms: 1000
    consumer:
      group-id: careerpilot
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  web:
    error:
      include-message: always

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:20}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:4}
    accept-count: ${TOMCAT_ACCEPT_COUNT:20}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

ai:
  provider: ${AI_PROVIDER:gemini}
  model: ${AI_MODEL:gemini-2.5-flash}   # flash is free-tier eligible; pro returns 429 limit:0 on free keys
  gemini:
    api-key: ${GEMINI_API_KEY:}
  # ---- AI Gateway: single entry point for all LLM calls, with failover ----
  gateway:
    primary: ${PRIMARY_PROVIDER:deepseek}
    # Failover priority: DeepSeek → Gemini → Groq → Qwen → GLM (provider diversity
    # is intentional — NVIDIA, Google, Groq, NVIDIA, Zhipu — so one vendor's
    # outage/quota never takes out two consecutive hops). Unconfigured providers
    # (no API key) are skipped automatically, so Groq and GLM simply sit idle
    # until GROQ_API_KEY / GLM_API_KEY are set — the live production order is
    # DeepSeek → Gemini → Qwen until those keys are supplied.
    order: ${AI_PROVIDER_ORDER:deepseek,gemini,groq,qwen,openrouter}
    default-temperature: 0.4
    # Phase A Enterprise Smart Router feature flag. false = pure sequential
    # failover over `order` (current production behavior, unchanged). Task-aware
    # routing using `routing` below is wired in a later phase and only takes
    # effect when this is true.
    smart-router-enabled: ${AI_SMART_ROUTER_ENABLED:false}
    # Per-task provider preference lists. LOADED BUT NOT CONSULTED in Phase A
    # (only used when smart-router-enabled=true). Lets per-task provider order
    # change via config alone — no code change. Unknown providers in a list are
    # ignored; unconfigured ones are skipped, exactly like `order`.
    routing:
      resumeOptimization: [deepseek, gemini, openrouter]
      atsOptimization: [deepseek, gemini, qwen]
      jobMatching: [deepseek, qwen, openrouter]
      chatbot: [deepseek, gemini, openrouter]
      interviewPreparation: [gemini, deepseek, groq]
      careerStrategy: [gemini, deepseek, openrouter]
      salaryIntelligence: [gemini, qwen, openrouter]
    providers:
      gemini:
        display-name: Gemini
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_MODEL:gemini-2.5-flash}
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
        timeout-ms: 15000
      deepseek:
        display-name: DeepSeek
        api-key: ${DEEP_SHEEK_NVIDIA_API_KEY:}
        # NVIDIA NIM IDs are vendor-namespaced; the bare "deepseek-v4-flash"
        # 404s. Keep the "deepseek-ai/" prefix in the default.
        model: ${NVIDIA_DEEPSEEK_MODEL:deepseek-ai/deepseek-v4-flash}
        base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
        timeout-ms: 20000
      groq:
        display-name: Groq
        api-key: ${GROQ_API_KEY:}
        model: ${GROQ_MODEL:llama-3.3-70b-versatile}
        base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
        timeout-ms: 20000
      qwen:
        display-name: Qwen
        api-key: ${QWEN3_NVIDIA_API_KEY:}
        model: ${NVIDIA_QWEN_MODEL:qwen/qwen3-next-80b-a3b-instruct}
        base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
        timeout-ms: 25000
      # OpenRouter — last-resort fallback, OpenAI-compatible. Provides access to
      # many models (free and paid). api-key is empty by default → provider is
      # UNAVAILABLE and skipped. Supply OPENROUTER_API_KEY to activate (it then
      # joins the chain after Qwen automatically). Model can be any OpenRouter-
      # supported model (e.g., qwen/qwen3-next-80b-a3b-instruct:free for free tier).
      openrouter:
        display-name: OpenRouter
        api-key: ${OPENROUTER_API_KEY:}
        model: ${OPENROUTER_MODEL:qwen/qwen3-next-80b-a3b-instruct:free}
        base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
        timeout-ms: 25000

  # ---- Embeddings: pgvector semantic search (Phase 2 Increment A) ----
  # Gated DARK by default. When enabled, discovered jobs (post-ingest, capped) and resumes (on
  # upload) get a Gemini text-embedding-004 vector (768-d, matching the vector(768) columns), and
  # GET /api/jobs/search/semantic does a cosine nearest-neighbor read. Reuses the gemini API key
  # from ai.gateway.providers.gemini — no separate key. Default off = zero new AI cost / no behavior
  # change; instant rollback by flipping the flag.
  embeddings:
    enabled: ${EMBEDDINGS_ENABLED:false}
    # gemini-embedding-001 supports outputDimensionality; we request 768 to match the vector(768)
    # columns. (text-embedding-004 is not available on this API key — it 404s.)
    model: ${EMBEDDINGS_MODEL:gemini-embedding-001}
    dimensions: ${EMBEDDINGS_DIMENSIONS:768}
    # Max characters of source text sent to the embedding API (cost + payload guard).
    max-chars: ${EMBEDDINGS_MAX_CHARS:8000}
    # Cap on how many missing-embedding jobs are embedded per discovery run (cost guard).
    max-per-run: ${EMBEDDINGS_MAX_PER_RUN:200}

# ---- Resilience4j: retry + circuit breaker per provider ----
resilience4j:
  retry:
    instances:
      # 2 retries before failing over (3 attempts total), exponential backoff
      # 1s → 2s. Quota/rate-limit (429) is mapped to QuotaExceededException and
      # ignored here, so a rate-limited provider fails over immediately instead of
      # burning the retry budget. CallNotPermittedException (open circuit) likewise
      # short-circuits straight to the next provider.
      gemini: &retryDefaults
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.lang.Exception
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - ai.careerpilot.ai.QuotaExceededException
      deepseek: *retryDefaults
      groq: *retryDefaults
      qwen: *retryDefaults
      openrouter: *retryDefaults
  circuitbreaker:
    instances:
      gemini: &cbDefaults
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 8
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      deepseek: *cbDefaults
      groq: *cbDefaults
      qwen: *cbDefaults
      openrouter: *cbDefaults

agent-service:
  base-url: ${AGENT_SERVICE_URL:http://localhost:8088}
  connect-timeout-ms: 5000
  read-timeout-ms: 120000

security:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: 60
    refresh-token-ttl-days: 30
  rate-limit:
    auth-per-minute: 10
    api-per-minute: 120
  # Comma-separated exact origins — no wildcards. Set to your Vercel URL(s),
  # e.g. https://careerpilot-ai.vercel.app,https://careerpilot-ai-git-main.vercel.app
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

storage:
  s3:
    endpoint: ${MINIO_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${MINIO_BUCKET:careerpilot}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    path-style: true

kafka:
  topics:
    workflow-events: careerpilot.workflow.events
    audit-events: careerpilot.audit.events

careerpilot:
  kafka:
    # When false (or Kafka unreachable), workflow event publishing is skipped
    # silently so a missing/broken broker never breaks the workflow path.
    enabled: ${KAFKA_ENABLED:true}

# ---- Phase 2 Job Discovery ----
# Real-job ingest from adapter providers. Keyless providers (RemoteOK, Arbeitnow)
# always run; keyed providers (Adzuna, Jooble) are skipped until their keys are set,
# so the platform works on free infra with zero extra config.
jobs:
  # ---- Recommendation engine (rule-based 6-factor scoring + LLM explanations) ----
  # All flag-gated for instant rollback: v2-enabled=false reverts Recommended to the
  # legacy unthresholded behavior with no redeploy.
  enrich:
    enabled: ${JOB_ENRICH_ENABLED:true}          # keyword classification at ingest
    # ---- LLM job enrichment (Phase 2 Increment B) ----
    # Semantic enrichment the keyword tier can't derive (seniority/skills/domains/salary-band/summary),
    # via the AI Gateway. Stored in the 1:1 job_ai_enrichment table; produced-but-not-consumed in v1
    # (matching does not read it yet). Gated DARK by default → zero LLM cost / no behavior change.
    ai:
      enabled: ${JOBS_ENRICH_AI_ENABLED:false}
      # Cap on how many missing-enrichment jobs are enriched per run (scheduler + backfill) — cost guard.
      max-per-run: ${JOBS_ENRICH_AI_MAX_PER_RUN:200}
      # Max characters of the job description sent to the LLM (cost + payload guard).
      max-chars: ${JOBS_ENRICH_AI_MAX_CHARS:6000}
      # Per-call provider preference for this structured-extraction task: prefer a FAST model
      # (gemini flash) over the default deepseek reasoning model (~68s/job → a few seconds). Still
      # falls back to the rest of the gateway chain on failure. Comma-separated; first configured wins.
      providers: ${JOBS_ENRICH_AI_PROVIDERS:gemini}
  # ---- Fuzzy job deduplication (Phase 2 Increment C) ----
  # Detects cross-source duplicate postings (same job on RemoteOK and Arbeitnow, say) via embedding
  # cosine similarity (Increment A) confirmed by title/company text match. Stored in job_duplicates;
  # produced-but-not-consumed in v1 — Browse/Recommended/Discovered do NOT filter on this yet.
  # Gated DARK by default → no rows written until explicitly flipped on.
  dedup:
    enabled: ${JOBS_DEDUP_ENABLED:false}
    # Cap on how many unchecked jobs are duplicate-checked per run (scheduler + backfill).
    max-per-run: ${JOBS_DEDUP_MAX_PER_RUN:200}
    # Minimum cosine similarity (1 - distance) for a neighbor to even be considered a candidate.
    embedding-threshold: ${JOBS_DEDUP_EMBEDDING_THRESHOLD:0.92}
    # Minimum title-token Jaccard similarity required when company names don't match exactly.
    title-jaccard-threshold: ${JOBS_DEDUP_TITLE_JACCARD_THRESHOLD:0.55}
  # ---- Industry / job-family quality filter ----
  # Excludes non-technical families (Marketing/Sales/HR/Recruiter/Support/Finance) from a tech
  # candidate's recommendations. The candidate's own family is never excluded. Flag-gated for
  # instant rollback: false = no family-based exclusion (legacy behavior).
  industry:
    filter-enabled: ${JOB_INDUSTRY_FILTER:true}
  # ---- Candidate-signal source for job matching (Phase 1 single-source-of-truth) ----
  # false (default) = matcher reads candidate signals from the legacy WorkflowRun snapshot +
  # live candidate_preferences (pre-Phase-1 behavior, unchanged). true = matcher reads from the
  # canonical CandidateProfile (resolved by CandidateSignalResolver), falling back to legacy only
  # for users who have no profile row yet. Flip on AFTER profiles are backfilled; instant rollback.
  matching:
    profile-source-enabled: ${JOBS_MATCHING_PROFILE_SOURCE_ENABLED:false}
    # When true, the matcher scores against the AI-enriched normalized_skills (job_ai_enrichment)
    # instead of the raw, often-generic provider jobs.skills column, for any job that has an
    # enrichment row — so prose-only listings match a candidate on their real tech stack. Falls back
    # to the raw skills for unenriched jobs. Requires JOBS_ENRICH_AI_ENABLED to have populated
    # enrichment. Default off; instant rollback.
    use-enrichment: ${JOBS_MATCHING_USE_ENRICHMENT:false}
    # Pre-gate: reject a job before full scoring if role similarity is below this (0-100).
    # Lowered from 40 → 10: a candidate with many skills needs fewer to appear in the job
    # description to clear the pre-gate; the 3-factor strict gate is the real quality filter.
    role-relevance-min: ${JOBS_MATCHING_ROLE_RELEVANCE_MIN:10}
    # Upper bound for the skill-ratio denominator. A thorough JD names many skill families;
    # without a cap, matched/allJobFamilies shrinks the more detailed the posting is, so strong
    # overlap on a rich JD scored LOWER than weak overlap on a thin one (real, relevant roles
    # landed at 68-69, just under the 70 gate). Cap treats a job as needing at most N core
    # families. Set very high (e.g. 999) to restore the old uncapped behavior (instant rollback).
    skill-denom-cap: ${JOBS_MATCHING_SKILL_DENOM_CAP:8}
    # ---- Phase 2B-5: mandatory preference hard-reject (Step 6) ----
    # Today work-mode/location/visa are soft weights only (1-10% of the score), so a job that
    # structurally cannot work for the candidate (e.g. onsite when they set "Remote only") can still
    # clear the gate on strong skills alone. When true, PreferenceGate rejects such jobs outright,
    # before scoring — only on an EXPLICIT signal (a stated preference + a known, conflicting job
    # field); never on missing/unknown data. Default off; instant rollback. See PreferenceGate.java.
    hard-preference-enabled: ${JOB_HARD_PREFERENCE_ENABLED:false}
    # ---- Phase 2B-3: MatchCache (Step 11) ----
    # Skips the rescore + persist cycle in refreshForUser when nothing changed (same resume/profile
    # version AND same discovered-pool version) since the last refresh, within a 24h TTL. Activates
    # the provisioned-but-unused Redis. Fails open (always a miss) if Redis is unreachable — never
    # serves a stale read on a cache error. Default off; instant rollback. See MatchCache.java.
    cache-enabled: ${JOB_MATCH_CACHE_ENABLED:false}
  recommendation:
    v2-enabled: ${JOB_RECO_V2_ENABLED:true}      # gate Recommended on score+confidence
    threshold: ${JOB_RECO_THRESHOLD:70}          # min match score for Recommended + Browse boundary (spec: 70)
    # Full-spec Recommended gate: score >= gate-min-score AND >= 1 matched role family AND
    # >= gate-min-skills matched skill families. false = legacy top-N-by-score (instant rollback).
    strict-gate-enabled: ${JOB_RECO_STRICT_GATE:true}
    gate-min-score: ${JOB_RECO_GATE_MIN_SCORE:70}
    gate-min-skills: ${JOB_RECO_GATE_MIN_SKILLS:3}
    # ---- Phase 2B-1 / 2C-2: action categorization (Step 7 → refined Step 2) ----
    # Buckets each persisted recommendation by its match score into a 5-tier action category
    # (AUTO_APPLY_READY >=95, HIGH_PRIORITY 90-94, HUMAN_REVIEW 80-89, RECOMMENDED 70-79, else ARCHIVED)
    # and a cross-cutting MUST_APPLY flag. Pure function of the score/breakdown — no re-score, no LLM.
    # Default off → category/must_apply stay NULL, zero behavior change.
    auto-categorization-enabled: ${JOB_AUTO_CATEGORIZATION_ENABLED:false}
    # ---- Phase 2C-1: priority engine (Step 4) ----
    # Computes a separate priority band (CRITICAL/HIGH/MEDIUM/LOW) = match score + additive bonuses
    # (visa/remote/exact-role/salary/recent). A distinct ranking dimension; never re-orders the existing
    # match-score-ordered Recommended list. Default off → priority stays NULL, zero behavior change.
    priority-enabled: ${RECOMMENDATION_PRIORITY_ENABLED:false}
  explain:
    enabled: ${JOB_EXPLAIN_ENABLED:true}         # "Why am I a match?" LLM endpoint
  # ---- Phase 3B.1: career-relevance keyword configuration (ai.careerpilot.discovery.relevance) ----
  # Comma-separated keyword overrides for RoleFamilyResolver/DomainPreferenceService. All optional —
  # each has a sensible built-in default matching the Phase 3B.1 spec's example mappings.
  relevance:
    role-family:
      java-backend: ${JOB_RELEVANCE_JAVA_BACKEND_TITLES:}
      data-engineering: ${JOB_RELEVANCE_DATA_ENGINEERING_TITLES:}
      devops: ${JOB_RELEVANCE_DEVOPS_TITLES:}
      frontend: ${JOB_RELEVANCE_FRONTEND_TITLES:}
    excluded-domains: ${JOB_RELEVANCE_EXCLUDED_DOMAINS:}
  discovery:
    enabled: ${JOB_DISCOVERY_ENABLED:true}
    # When true, Domestic/International tabs derive their country set from the candidate's own
    # profile (home country / preferred countries) instead of the client-supplied country param,
    # and user-excluded roles are filtered out. Default off → legacy behavior, instant rollback.
    scope-strict-enabled: ${JOBS_DISCOVERY_SCOPE_STRICT_ENABLED:false}
    # Daily at 06:00. Tighten to hourly later ("0 0 * * * *") with no code change.
    cron: ${JOB_DISCOVERY_CRON:0 0 6 * * *}
    user-agent: ${JOB_DISCOVERY_USER_AGENT:CareerPilotAI/1.0 (+https://careerpilot.ai)}
    providers:
      remoteok:
        base-url: ${REMOTEOK_BASE_URL:https://remoteok.com}
      arbeitnow:
        base-url: ${ARBEITNOW_BASE_URL:https://www.arbeitnow.com}
      adzuna:
        base-url: ${ADZUNA_BASE_URL:https://api.adzuna.com}
        app-id: ${ADZUNA_APP_ID:}
        app-key: ${ADZUNA_APP_KEY:}
        countries: ${ADZUNA_COUNTRIES:gb,us,in}
        results-per-page: ${ADZUNA_RESULTS_PER_PAGE:50}
      jooble:
        base-url: ${JOOBLE_BASE_URL:https://jooble.org}
        api-key: ${JOOBLE_API_KEY:}
        keywords: ${JOOBLE_KEYWORDS:software engineer,data engineer}
    # ---- Phase 2A: Enterprise Job Lake (SHADOW pipeline) ----
    # Additive, layered discovery (job_raw → job_normalized → job_lake) that runs ALONGSIDE the
    # legacy discovery above and NEVER writes into the `jobs` table. Ships DARK: every flag below
    # defaults false → no rows written, no scheduled run, zero behavior change until explicitly on.
    # NOTE: the master flag is JOB_LAKE_DISCOVERY_ENABLED, NOT JOB_DISCOVERY_ENABLED — the latter is
    # already bound to the LEGACY pipeline above (jobs.discovery.enabled), and reusing it would turn
    # the live pipeline off. Distinct name = no regression.
    lake:
      enabled: ${JOB_LAKE_DISCOVERY_ENABLED:false}
      # Daily at 02:00 UTC (zone pinned in the scheduler). Separate from the legacy 06:00 cron.
      cron: ${JOB_LAKE_DISCOVERY_CRON:0 0 2 * * *}
      # Deterministic (AI-free) dedup over job_normalized → job_duplicate_mapping. Default off.
      dedup-enabled: ${JOB_DISCOVERY_DEDUP_ENABLED:false}
      # Min title-token Jaccard to confirm a same-(country,city) candidate is the same posting.
      dedup-title-threshold: ${JOB_LAKE_DEDUP_TITLE_THRESHOLD:0.6}
      # Software-only pre-store gate (reuses JobTaxonomy). Off → store everything (Step 9). Default off.
      software-filter-enabled: ${JOB_SOFTWARE_FILTER_ENABLED:false}

# ---- Phase 2C Recommendation Intelligence (human approval + feedback) ----
# All default DARK — endpoints inert / no rows written until explicitly enabled.
recommendation:
  approval:
    # Gates the /api/recommendations approve|reject|save|archive endpoints, which write to the
    # existing Application entity (reuse, not a parallel queue). Off → those endpoints return 404.
    enabled: ${RECOMMENDATION_APPROVAL_ENABLED:false}
  feedback:
    # Gates recommendation feedback capture (Step 6): the POST /feedback endpoint AND the automatic
    # capture from an approve/reject/save/archive decision. Off → no rows written, decisions still work.
    # Feeds the 2C-5 candidate_behavior_profile.
    enabled: ${RECOMMENDATION_FEEDBACK_ENABLED:false}

# ---- Phase 2D.1 Resume Tailoring Engine ----
# All default DARK — endpoints return 404 / worker no-ops until explicitly enabled. The original
# resume (resumes.s3_key / parsed_text) is never modified; every generation is a new immutable
# resume_tailoring row. Never runs synchronously inside RecommendationDecisionService.decide() —
# approval publishes RecommendationApprovedEvent, consumed async/after-commit by
# ResumeTailoringWorker, so tailoring latency/failures can never affect the approval response.
resume:
  # ---- Phase 7.2/7.3 Resume Selection + autopilot tailoring trigger (dark) ----
  selection:
    enabled: ${RESUME_SELECTION_ENABLED:false}
    ats-floor: ${RESUME_SELECTION_ATS_FLOOR:70}
  autopilot:
    enabled: ${RESUME_AUTOPILOT_ENABLED:false}
  tailoring:
    # Master switch for the engine itself (manual POST /api/resume/tailor + GET endpoints).
    enabled: ${RESUME_TAILORING_ENABLED:false}
    # Redis-backed cache keyed on (user, resume version, job version, profile version), 7-day TTL.
    # Independent of the master switch so caching behavior can be validated separately.
    cache-enabled: ${RESUME_TAILORING_CACHE_ENABLED:false}
    trigger-on-approve:
      # Separate flag: lets the engine be manually testable via the API before the approve-flow
      # auto-trigger (RecommendationApprovedEvent -> ResumeTailoringWorker) is turned on.
      enabled: ${RESUME_TAILORING_TRIGGER_ON_APPROVE_ENABLED:false}
    min-length-chars: ${RESUME_TAILORING_MIN_LENGTH:800}
    max-length-chars: ${RESUME_TAILORING_MAX_LENGTH:20000}
    # Phase 2D.1.1 — bounded pool for the async job pipeline (ResumeTailoringJobService), separate
    # from the app-wide default @Async executor. Small on purpose: each task holds an LLM call for
    # up to ~2 minutes under provider degradation (see the Phase 2D.1 sign-off's P95 finding).
    executor:
      core-pool-size: ${RESUME_TAILORING_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${RESUME_TAILORING_EXECUTOR_MAX_POOL_SIZE:5}
      queue-capacity: ${RESUME_TAILORING_EXECUTOR_QUEUE_CAPACITY:50}
    # Phase 2D.1.1 — per-call provider preference passed to AiGatewayService.chat(...,
    # preferredProviders), tried before the rest of the default ai.gateway.order chain. Gemini
    # first by default: the live sign-off found DeepSeek's 20s-per-attempt timeout + circuit-breaker
    # cascade was the dominant cost in every sampled tailoring generation (P95 ~117s). Empty list
    # falls back to the default gateway order unchanged.
    preferred-providers: ${RESUME_TAILORING_PREFERRED_PROVIDERS:gemini,groq,deepseek,qwen,openrouter}

# ---- Phase 2D.2 ATS Optimization Engine ----
# Analyzes the LATEST tailored resume (from 2D.1) against its job: a deterministic ATS score
# (reuses ResumeImprovementCalculator) plus LLM-generated matched/missing keywords and
# optimization suggestions. Async job pipeline from day one (see resume.tailoring.executor's
# comment for why) — no synchronous version ever shipped. All default DARK.
ats:
  optimization:
    enabled: ${ATS_OPTIMIZATION_ENABLED:false}
    trigger-on-tailoring:
      # Separate flag: auto-triggers on ResumeTailoredEvent (published once a tailoring succeeds).
      # Independent of `enabled` so the engine stays manually testable via the API first.
      enabled: ${ATS_OPTIMIZATION_TRIGGER_ON_TAILORING_ENABLED:false}
    executor:
      core-pool-size: ${ATS_OPTIMIZATION_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${ATS_OPTIMIZATION_EXECUTOR_MAX_POOL_SIZE:5}
      queue-capacity: ${ATS_OPTIMIZATION_EXECUTOR_QUEUE_CAPACITY:50}
    # No new provider-routing env var — reuses the existing ai.gateway.routing.atsOptimization
    # list above (previously loaded-but-unused smart-router scaffolding).

# ---- Phase 2D.3 Gap Analysis Engine (deterministic, non-LLM) ----
# Triggered by AtsOptimizedEvent. All default DARK. Cache is versioned on (tailoringId,
# atsAnalysisId), 7-day TTL, fail-open (deterministic recompute is always safe).
gap:
  analysis:
    enabled: ${GAP_ANALYSIS_ENABLED:false}
    trigger:
      enabled: ${GAP_ANALYSIS_TRIGGER_ENABLED:false}
    cache-enabled: ${GAP_ANALYSIS_CACHE_ENABLED:true}
    executor:
      core-pool-size: ${GAP_ANALYSIS_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${GAP_ANALYSIS_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${GAP_ANALYSIS_EXECUTOR_QUEUE_CAPACITY:100}

# ---- Phase 2D.4 ATS Explainability Engine (deterministic, non-LLM) ----
# Triggered by GapAnalysisCompletedEvent. All default DARK.
ats.explainability:
  enabled: ${ATS_EXPLAINABILITY_ENABLED:false}
  trigger:
    enabled: ${ATS_EXPLAINABILITY_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${ATS_EXPLAINABILITY_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${ATS_EXPLAINABILITY_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${ATS_EXPLAINABILITY_EXECUTOR_QUEUE_CAPACITY:100}

# ---- Phase 2D.5 Cover Letter Engine (LLM-backed, validator-guarded) ----
# Triggered by AtsExplainabilityCompletedEvent. All default DARK. Validator rejects fabricated
# credential claims and letters that don't name the target company.
cover:
  letter:
    enabled: ${COVER_LETTER_ENABLED:false}
    trigger:
      enabled: ${COVER_LETTER_TRIGGER_ENABLED:false}
    cache-enabled: ${COVER_LETTER_CACHE_ENABLED:true}
    min-length-chars: ${COVER_LETTER_MIN_LENGTH:300}
    max-length-chars: ${COVER_LETTER_MAX_LENGTH:6000}
    executor:
      core-pool-size: ${COVER_LETTER_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${COVER_LETTER_EXECUTOR_MAX_POOL_SIZE:5}
      queue-capacity: ${COVER_LETTER_EXECUTOR_QUEUE_CAPACITY:50}

# ---- Phase 2D.6 Application Package Builder (deterministic assembly by reference) ----
# Triggered by CoverLetterCompletedEvent. All default DARK.
application:
  package:
    enabled: ${APPLICATION_PACKAGE_ENABLED:false}
    trigger:
      enabled: ${APPLICATION_PACKAGE_TRIGGER_ENABLED:false}
    cache-enabled: ${APPLICATION_PACKAGE_CACHE_ENABLED:true}
    executor:
      core-pool-size: ${APPLICATION_PACKAGE_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${APPLICATION_PACKAGE_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${APPLICATION_PACKAGE_EXECUTOR_QUEUE_CAPACITY:100}
    # ---- Phase 7.11 Application Package Intelligence (validation / canonical source of truth; dark) ----
    # validation.enabled gates the engine; validation.trigger.enabled chains it onto ApplicationPackageReadyEvent.
    validation:
      enabled: ${APPLICATION_PACKAGE_VALIDATION_ENABLED:false}
      trigger:
        enabled: ${APPLICATION_PACKAGE_VALIDATION_TRIGGER_ENABLED:false}
      require-learning: ${APPLICATION_PACKAGE_VALIDATION_REQUIRE_LEARNING:false}
      executor:
        core-pool-size: ${APPLICATION_PACKAGE_VALIDATION_EXECUTOR_CORE_POOL_SIZE:2}
        max-pool-size: ${APPLICATION_PACKAGE_VALIDATION_EXECUTOR_MAX_POOL_SIZE:4}
        queue-capacity: ${APPLICATION_PACKAGE_VALIDATION_EXECUTOR_QUEUE_CAPACITY:200}
    history:
      enabled: ${APPLICATION_PACKAGE_HISTORY_ENABLED:false}
    diagnostics:
      enabled: ${APPLICATION_PACKAGE_DIAGNOSTICS_ENABLED:false}
  # ---- Phase 7.12 AI Review Pipeline (final quality gate; reviews the 7.11 package; dark) ----
  # review.enabled gates the pipeline; review.trigger.enabled chains it onto ApplicationPackageValidatedEvent.
  # Each reviewer has its own flag so they can be canaried one at a time.
  review:
    enabled: ${APPLICATION_REVIEW_ENABLED:false}
    trigger:
      enabled: ${APPLICATION_REVIEW_TRIGGER_ENABLED:false}
    resume:
      enabled: ${APPLICATION_REVIEW_RESUME_ENABLED:false}
    ats:
      enabled: ${APPLICATION_REVIEW_ATS_ENABLED:false}
    company:
      enabled: ${APPLICATION_REVIEW_COMPANY_ENABLED:false}
    learning:
      enabled: ${APPLICATION_REVIEW_LEARNING_ENABLED:false}
    consistency:
      enabled: ${APPLICATION_REVIEW_CONSISTENCY_ENABLED:false}
    quality:
      enabled: ${APPLICATION_REVIEW_QUALITY_ENABLED:false}
    diagnostics:
      enabled: ${APPLICATION_REVIEW_DIAGNOSTICS_ENABLED:false}
    executor:
      core-pool-size: ${APPLICATION_REVIEW_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${APPLICATION_REVIEW_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${APPLICATION_REVIEW_EXECUTOR_QUEUE_CAPACITY:200}
  # ---- Phase 7.1 Application Decision Engine (deterministic; dark) ----
  decision:
    enabled: ${APPLICATION_DECISION_ENABLED:false}
    auto-apply-min-score: ${APPLICATION_DECISION_AUTO_APPLY_MIN_SCORE:90}
    review-min-score: ${APPLICATION_DECISION_REVIEW_MIN_SCORE:75}
    save-min-score: ${APPLICATION_DECISION_SAVE_MIN_SCORE:60}
    ats-floor: ${APPLICATION_DECISION_ATS_FLOOR:70}
    failure-penalty-cap: ${APPLICATION_DECISION_FAILURE_PENALTY_CAP:-20}
  # ---- Phase 7.4 Auto Apply Engine (fail-safe; no provider integration; dark) ----
  auto:
    enabled: ${APPLICATION_AUTO_ENABLED:false}

# ---- Phase 2D.7 Auto Apply Package Preparation (deterministic; PREPARATION ONLY, no automation) ----
# Triggered by ApplicationPackageReadyEvent. All default DARK.
auto:
  apply:
    package:
      enabled: ${AUTO_APPLY_PACKAGE_ENABLED:false}
    trigger:
      enabled: ${AUTO_APPLY_TRIGGER_ENABLED:false}
    executor:
      core-pool-size: ${AUTO_APPLY_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${AUTO_APPLY_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${AUTO_APPLY_EXECUTOR_QUEUE_CAPACITY:100}

# ==== Phase 2E — Enterprise Auto-Apply Execution Engine (HIGH RISK) ====
# The entire execution platform ships DARK and INERT. With these defaults nothing submits an
# application and nothing auto-starts off 2D output: the safety/approval GATES default enabled=true
# (they must never be skippable when the pipeline runs), but every pipeline-ENTRY trigger defaults
# false, so completing a 2D pipeline creates ZERO 2E rows. Browser automation is a throwing stub with
# no Playwright dependency; every ATS connector is unconfigured. Enabling is a separate, later,
# human-gated decision. NEVER flip execution/browser/ats/*_trigger on without the rollout plan.
# NOTE: dotted top-level keys (like the existing `ats.explainability:`) so these don't collide with
# the Phase-2D `application:` / `ats:` blocks above — Spring relaxed-binding flattens both forms.
application.execution:
  enabled: ${APPLICATION_EXECUTION_ENABLED:false}
  trigger:
    # Fires ApplicationExecutionWorker off a human-published ApprovalGrantedEvent only.
    enabled: ${APPLICATION_EXECUTION_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${APPLICATION_EXECUTION_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${APPLICATION_EXECUTION_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${APPLICATION_EXECUTION_EXECUTOR_QUEUE_CAPACITY:50}
application.approval:
  # Human approval is MANDATORY (default true). Disabling does NOT create an auto-approve path —
  # it only stops enqueueing new approval requests. There is no AUTO_APPROVE in this version.
  enabled: ${APPLICATION_APPROVAL_ENABLED:true}
application.safety:
  # The safety GATE itself (default on — never skippable). A disabled gate is a CLOSED gate.
  enabled: ${APPLICATION_SAFETY_ENABLED:true}
  trigger:
    # The pipeline ENTRY. Default false: SafetyValidationWorker does NOT auto-fire off
    # ApplicationPackageReadyEvent until this is explicitly flipped.
    enabled: ${APPLICATION_SAFETY_TRIGGER_ENABLED:false}
  ats-min-score: ${APPLICATION_SAFETY_ATS_MIN_SCORE:60}
  gap-max-score: ${APPLICATION_SAFETY_GAP_MAX_SCORE:60}
  blacklist-companies: ${APPLICATION_SAFETY_BLACKLIST_COMPANIES:}
application.retry:
  max-attempts: ${APPLICATION_RETRY_MAX_ATTEMPTS:3}
  base-backoff-ms: ${APPLICATION_RETRY_BASE_BACKOFF_MS:1000}
application.tracking:
  enabled: ${APPLICATION_TRACKING_ENABLED:false}
  trigger:
    enabled: ${APPLICATION_TRACKING_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${APPLICATION_TRACKING_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${APPLICATION_TRACKING_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${APPLICATION_TRACKING_EXECUTOR_QUEUE_CAPACITY:100}
application.analytics:
  enabled: ${APPLICATION_ANALYTICS_ENABLED:false}
  trigger:
    enabled: ${APPLICATION_ANALYTICS_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${APPLICATION_ANALYTICS_EXECUTOR_CORE_POOL_SIZE:1}
    max-pool-size: ${APPLICATION_ANALYTICS_EXECUTOR_MAX_POOL_SIZE:2}
    queue-capacity: ${APPLICATION_ANALYTICS_EXECUTOR_QUEUE_CAPACITY:100}
browser.automation:
  # INERT STUB. No Playwright dependency exists; every action throws. Flag has no real effect.
  enabled: ${BROWSER_AUTOMATION_ENABLED:false}
  executor:
    core-pool-size: ${BROWSER_AUTOMATION_EXECUTOR_CORE_POOL_SIZE:1}
    max-pool-size: ${BROWSER_AUTOMATION_EXECUTOR_MAX_POOL_SIZE:2}
    queue-capacity: ${BROWSER_AUTOMATION_EXECUTOR_QUEUE_CAPACITY:20}
ats.connector:
  # Every connector is an unconfigured stub; submit() throws. Flag has no real effect.
  enabled: ${ATS_CONNECTOR_ENABLED:false}
  executor:
    core-pool-size: ${ATS_CONNECTOR_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${ATS_CONNECTOR_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${ATS_CONNECTOR_EXECUTOR_QUEUE_CAPACITY:50}

# ---- Phase 3A: Enterprise Application Tracking Workflow (ships DARK) ----
# Event-driven workflow (NOT a linear pipeline) that tracks an application AFTER it exists:
# Applied -> Viewed -> Assessment -> Interview -> Offer -> Accepted/Rejected. Isolated in the
# ai.careerpilot.workflow bounded context with its own `workflow.*` flag namespace so Phase 2E stays
# byte-for-byte untouched (2E owns application.tracking.*/application.analytics.* above). Every stage
# has TWO flags: `<stage>.enabled` gates the engine itself; `<stage>.trigger.enabled` gates whether it
# auto-fires off the prior stage's event. ALL default false: with stock flags the WorkflowEntryBridge
# mints nothing, so creating an application produces ZERO Phase 3A rows. Migrations V36-V43 are written
# but NOT applied. Enabling is a separate, later, human-gated decision — canary one stage at a time,
# engine-enabled first (verify via /api/diagnostics/<stage>), then trigger-enabled. Dotted top-level
# keys (like `ats.explainability:`) so relaxed-binding flattens them without colliding.
workflow.tracking:
  # 3A.1 lifecycle state machine (also gates StatusDetectionWorker). Entry gate for the whole workflow.
  enabled: ${WORKFLOW_TRACKING_ENABLED:false}
  trigger:
    enabled: ${WORKFLOW_TRACKING_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${WORKFLOW_TRACKING_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${WORKFLOW_TRACKING_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${WORKFLOW_TRACKING_EXECUTOR_QUEUE_CAPACITY:100}
workflow.status-detection:
  # StatusDetectionWorker shares workflow.tracking.* flags; it needs only its own dedicated executor.
  executor:
    core-pool-size: ${WORKFLOW_STATUS_DETECTION_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${WORKFLOW_STATUS_DETECTION_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${WORKFLOW_STATUS_DETECTION_EXECUTOR_QUEUE_CAPACITY:100}
workflow.timeline:
  # 3A.2 append-only timeline.
  enabled: ${WORKFLOW_TIMELINE_ENABLED:false}
  trigger:
    enabled: ${WORKFLOW_TIMELINE_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${WORKFLOW_TIMELINE_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${WORKFLOW_TIMELINE_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${WORKFLOW_TIMELINE_EXECUTOR_QUEUE_CAPACITY:100}
email.intelligence:
  # 3A.3 INERT deterministic keyword classifier — no live mailbox, no external fetch, no LLM.
  enabled: ${EMAIL_INTELLIGENCE_ENABLED:false}
  trigger:
    enabled: ${EMAIL_INTELLIGENCE_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${EMAIL_INTELLIGENCE_EXECUTOR_CORE_POOL_SIZE:1}
    max-pool-size: ${EMAIL_INTELLIGENCE_EXECUTOR_MAX_POOL_SIZE:2}
    queue-capacity: ${EMAIL_INTELLIGENCE_EXECUTOR_QUEUE_CAPACITY:100}
interview.tracking:
  # 3A.4 interview rounds (gates both InterviewDetectionWorker and InterviewTrackingWorker).
  enabled: ${INTERVIEW_TRACKING_ENABLED:false}
  trigger:
    enabled: ${INTERVIEW_TRACKING_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${INTERVIEW_TRACKING_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${INTERVIEW_TRACKING_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${INTERVIEW_TRACKING_EXECUTOR_QUEUE_CAPACITY:100}
workflow.analytics:
  # 3A.5 outcome analytics (gates both OfferDetectionWorker and AnalyticsWorker). Uses the
  # careerAnalyticsExecutor bean — deliberately NOT 2E's analyticsExecutor.
  enabled: ${WORKFLOW_ANALYTICS_ENABLED:false}
  trigger:
    enabled: ${WORKFLOW_ANALYTICS_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${WORKFLOW_ANALYTICS_EXECUTOR_CORE_POOL_SIZE:1}
    max-pool-size: ${WORKFLOW_ANALYTICS_EXECUTOR_MAX_POOL_SIZE:2}
    queue-capacity: ${WORKFLOW_ANALYTICS_EXECUTOR_QUEUE_CAPACITY:100}
career.intelligence:
  # 3A.6 deterministic (no-LLM) career probabilities. Terminal stage — publishes nothing further.
  enabled: ${CAREER_INTELLIGENCE_ENABLED:false}
  trigger:
    enabled: ${CAREER_INTELLIGENCE_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${CAREER_INTELLIGENCE_EXECUTOR_CORE_POOL_SIZE:1}
    max-pool-size: ${CAREER_INTELLIGENCE_EXECUTOR_MAX_POOL_SIZE:2}
    queue-capacity: ${CAREER_INTELLIGENCE_EXECUTOR_QUEUE_CAPACITY:100}

# ---- Phase 3B.1: Career-Relevant Domestic/International Job Feed Engine ----
# Converts Domestic/International from location-only feeds into career-aware feeds (role + skill +
# experience + domain relevance >= 70), while Browse stays the unfiltered "everything" tab. Ships
# fully DARK: all four flags default false. career.relevance.enabled is the master switch (read by
# CareerRelevanceEvaluator); the two per-scope filter flags are read by JobService.discovered and
# only take effect when the master flag is also on, so Domestic and International can be canaried
# independently. career.explainability.enabled gates GET /api/jobs/{id}/relevance (404 when off).
# See docs/PHASE_3B_1.md, docs/PHASE_3B_1_FILTER_RULES.md, docs/PHASE_3B_1_ROLLBACK.md.
#
# ---- Phase 3B.1.1: Soft Relevance Threshold Engine ----
# Replaces the flat "score < 70 => reject" cutoff with per-feed bands (CareerThresholdPolicy),
# gated by career.soft-thresholds.enabled (default false). While off, CareerThresholdPolicy
# reproduces the exact legacy >=70 cutoff, so Domestic/International behavior is unchanged until
# this flag is explicitly flipped. career.relevance.thresholds.* configures the per-feed cutoffs
# (recommended/domestic/international/hidden) used only once the flag is on.
# See docs/PHASE_3B_1_1.md, docs/PHASE_3B_1_1_THRESHOLD_POLICY.md, docs/PHASE_3B_1_1_MATCH_STRENGTH.md.
career:
  # ---- Phase 7.10 Career Orchestrator (autonomous apply-side pipeline; dark) ----
  orchestrator:
    enabled: ${CAREER_ORCHESTRATOR_ENABLED:false}
    cron: ${CAREER_ORCHESTRATOR_CRON:0 30 2 * * *}
    max-per-user: ${CAREER_ORCHESTRATOR_MAX_PER_USER:25}
    executor:
      core-pool-size: ${CAREER_ORCHESTRATOR_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${CAREER_ORCHESTRATOR_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${CAREER_ORCHESTRATOR_EXECUTOR_QUEUE_CAPACITY:200}
  relevance:
    enabled: ${CAREER_RELEVANCE_ENABLED:false}
    thresholds:
      recommended: ${CAREER_THRESHOLD_RECOMMENDED:85}
      domestic: ${CAREER_THRESHOLD_DOMESTIC:60}
      international: ${CAREER_THRESHOLD_INTERNATIONAL:60}
      hidden: ${CAREER_THRESHOLD_HIDDEN:60}
  soft-thresholds:
    enabled: ${CAREER_SOFT_THRESHOLDS_ENABLED:false}
  domestic:
    filter:
      enabled: ${CAREER_DOMESTIC_FILTER_ENABLED:false}
  international:
    filter:
      enabled: ${CAREER_INTERNATIONAL_FILTER_ENABLED:false}
  explainability:
    enabled: ${CAREER_EXPLAINABILITY_ENABLED:false}

# ---- Phase 7.8/7.9/7.7 Company research, interview prep, calendar (dark) ----
company:
  research:
    enabled: ${COMPANY_RESEARCH_ENABLED:false}
interview:
  prep:
    enabled: ${INTERVIEW_PREP_ENABLED:false}
calendar:
  integration:
    enabled: ${CALENDAR_INTEGRATION_ENABLED:false}

# ---- Data retention (Phase 3B prep) ----
# Additive, flag-gated purge of append-only ledgers that otherwise grow unbounded. DISABLED by
# default: with retention.enabled=false the daily scheduler fires but RetentionService is a no-op
# and deletes nothing. Each target has its own age window (days); correlations are purged only when
# terminal, so an in-flight workflow is never reaped. Manual trigger: POST /api/admin/retention/run
# (admin-role gated). Enable only after choosing per-target windows appropriate to your compliance needs.
retention:
  enabled: ${RETENTION_ENABLED:false}
  cron: ${RETENTION_CRON:0 30 3 * * *}
  workflow-dead-letter:
    days: ${RETENTION_WORKFLOW_DEAD_LETTER_DAYS:90}
  workflow-correlation:
    days: ${RETENTION_WORKFLOW_CORRELATION_DAYS:180}
  recommendation-audit:
    days: ${RETENTION_RECOMMENDATION_AUDIT_DAYS:365}
  execution-audit:
    days: ${RETENTION_EXECUTION_AUDIT_DAYS:365}
  resume-tailoring-audit:
    days: ${RETENTION_RESUME_TAILORING_AUDIT_DAYS:365}

# ---- Candidate Intelligence Profile (Phase 1) ----
# Canonical AI-analyzed profile = resume intelligence merged with a snapshot of
# candidate_preferences. Ships DARK: enabled=false → event listeners no-op and the
# /api/candidate-profile endpoints return 404, so there is zero behavior change until
# explicitly flipped on after validation. Consumed by job matching/discovery once the relevant
# downstream flag (jobs.matching.profile-source-enabled / candidate.profile.single-source-enabled)
# is also on.
candidate:
  profile:
    enabled: ${CANDIDATE_PROFILE_ENABLED:false}
    # Cap on resume characters sent to the LLM extraction (cost/latency guard).
    max-resume-chars: ${CANDIDATE_PROFILE_MAX_RESUME_CHARS:12000}
    backfill:
      # Pause between LLM extractions during the one-time enablement backfill, so generating
      # profiles for every existing user stays within the shared provider rate limits.
      throttle-ms: ${CANDIDATE_PROFILE_BACKFILL_THROTTLE_MS:500}
    # Phase 1.5 — when true, Domestic/International discovery and excluded-role filtering read the
    # canonical CandidateProfile (via CandidateSignalResolver.resolveLocationSignals), falling back
    # to live candidate_preferences for users with no profile row yet. Independent of
    # jobs.matching.profile-source-enabled (which only gates the Recommended-tab matcher) so the two
    # consumer groups can be migrated on separate schedules. Default off; instant rollback.
    single-source-enabled: ${PROFILE_SINGLE_SOURCE_ENABLED:false}
    rebuild:
      # Phase 1.5 — weekly catch-up rebuild for users whose cached extraction has drifted from their
      # latest resume (e.g. after a prompt/schema change). Reuses the same idempotent
      # needsBackfill/backfillUser fingerprint check as the one-time enablement backfill, so a
      # crashed run simply re-evaluates staleness next time. Default off; instant rollback.
      enabled: ${CANDIDATE_PROFILE_REBUILD_ENABLED:false}
      cron: ${CANDIDATE_PROFILE_REBUILD_CRON:0 0 2 ? * SUN}
      max-per-run: ${CANDIDATE_PROFILE_REBUILD_MAX_PER_RUN:200}
  recommendation:
    # Phase 1.5 — persists the per-job scoring breakdown (skill/role/preference/location/visa/salary/
    # final) from JobScoring.scoreV2 into recommendation_audit, for explainability. Purely additive
    # side effect after scoring; never affects the returned recommendation. Default off.
    audit-enabled: ${CANDIDATE_RECOMMENDATION_AUDIT_ENABLED:false}

# ---- Phase 7.15 STAR Story Intelligence & Behavioral AI (additive, dark) ----
# story.engine.enabled gates the orchestrating facade (StarStoryEngine); every sub-capability has
# its own flag so it can be canaried independently. story.worker.trigger.enabled chains automatic
# candidate-story drafting onto the existing Phase 6.1 LearningEventRecordedEvent. All default off.
story:
  engine:
    enabled: ${STORY_ENGINE_ENABLED:false}
  extraction:
    enabled: ${STORY_EXTRACTION_ENABLED:false}
  generation:
    enabled: ${STORY_GENERATION_ENABLED:false}
  recommendation:
    enabled: ${STORY_RECOMMENDATION_ENABLED:false}
  analytics:
    enabled: ${STORY_ANALYTICS_ENABLED:false}
  search:
    enabled: ${STORY_SEARCH_ENABLED:false}
  history:
    enabled: ${STORY_HISTORY_ENABLED:false}
  diagnostics:
    enabled: ${STORY_DIAGNOSTICS_ENABLED:false}
  worker:
    trigger:
      enabled: ${STORY_WORKER_TRIGGER_ENABLED:false}
  executor:
    core-pool-size: ${STORY_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${STORY_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${STORY_EXECUTOR_QUEUE_CAPACITY:200}

logging:
  level:
    root: INFO
    ai.careerpilot: DEBUG
