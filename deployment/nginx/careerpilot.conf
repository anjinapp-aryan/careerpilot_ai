# CareerPilot AI — Nginx reverse proxy (production hardening, Phase 2)
#
# Internet -> :80 (this file) -> loopback-only Docker containers:
#   /        -> frontend  (127.0.0.1:5173)
#   /api/    -> backend   (127.0.0.1:8080)
#   /agent/  -> agent-service (127.0.0.1:8088) — diagnostics only, never
#               called by the frontend; the backend reaches it over the
#               internal Docker network, not through this route.
#
# HTTPS (443 + redirect) is added by certbot in Phase 5 — this file is the
# HTTP-only version for initial verification before a domain/cert exist.
#
# Install: sudo dnf install -y nginx
#          sudo cp deployment/nginx/careerpilot.conf /etc/nginx/conf.d/careerpilot.conf
#          sudo nginx -t && sudo systemctl enable --now nginx

# Upgrade/Connection map: the standard idiom so plain HTTP requests aren't
# broken by an unconditional "Connection: upgrade" header. Only matters if a
# future feature adds real WebSocket — today's Copilot streaming uses SSE
# (Server-Sent Events), not WebSocket, but this makes the proxy ready either
# way with zero cost to normal traffic.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;   # replaced with the real domain by certbot in Phase 5

    # Resume uploads go through the backend — Nginx's 1m default is too small.
    client_max_body_size 20m;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/xml font/woff2;
    # Intentionally NOT gzipping text/event-stream — compression buffers
    # output, which would defeat the whole point of Copilot's SSE streaming.

    # ---- baseline security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # No HSTS here — that's added alongside the HTTPS block in Phase 5; an
    # HSTS header over plain HTTP has no effect and would be misleading.

    # ---- Backend API ----
    # No trailing path on proxy_pass -> Nginx forwards the URI unchanged, so
    # /api/jobs reaches Spring as /api/jobs (Spring's controllers already
    # expect the /api prefix themselves — do NOT strip it here).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI Gateway calls (workflow runs, copilot) can legitimately take
        # 30-90s; give real headroom instead of Nginx's 60s default.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Copilot streams tokens over SSE (text/event-stream) — buffering
        # would hold the whole response until complete, defeating streaming.
        proxy_buffering off;
        proxy_cache off;
    }

    # ---- Agent service (diagnostics/health only) ----
    # Trailing slash on both location and proxy_pass strips the /agent
    # prefix, so /agent/health reaches FastAPI as /health.
    location /agent/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # ---- Frontend (everything else) ----
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Future-proofing for real WebSocket, if ever added — no effect on
        # today's plain HTTP/SSE traffic.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
