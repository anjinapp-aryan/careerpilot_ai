# Local-dev overlay — NOT auto-merged (only the literal name
# docker-compose.override.yml gets that treatment). Apply it explicitly:
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Restores local-dev conveniences (direct host access to internal services,
# verbose logging, Swagger UI) that were intentionally stripped from
# docker-compose.yml when it was hardened for the Oracle Cloud VM deploy
# (SPRING_PROFILES_ACTIVE=prod, and no host ports for redis/kafka/minio).
#
# Note: agent-service does NOT need a ports: entry here — docker-compose.yml
# already publishes it loopback-only (127.0.0.1:8088:8088, for the VM's Nginx
# reverse proxy), which is equally usable from the host for local dev. Adding
# a second "8088:8088" publish here used to collide with that existing bind
# (0.0.0.0:8088 and 127.0.0.1:8088 for the same container port fight over the
# socket) and made `docker compose up` flaky/order-dependent — don't re-add it.
#
# On the VM: don't copy this file over, and don't pass the -f flag above —
# docker-compose.yml alone gives you the hardened production behavior.

services:
  redis:
    ports:
      - "6379:6379"
  kafka:
    ports:
      - "9092:9092"
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
  backend:
    environment:
      # Empty = no active profile, i.e. application.yml's own dev-friendly
      # defaults (DEBUG ai.careerpilot logging, Swagger enabled) — matching
      # the pre-hardening local behavior documented in CLAUDE.md.
      SPRING_PROFILES_ACTIVE: ""
    ports: !override
      # Host 8181 -> container 8080. Host 8080 was occupied by an unrelated
      # local httpd process on this machine; the app itself still listens on
      # 8080 inside the container (server.port default in application.yml),
      # only the host-side publish moved. !override replaces
      # docker-compose.yml's own "127.0.0.1:8080:8080" entry instead of
      # merging alongside it — without it, ports: lists concatenate and 8080
      # stays published too.
      - "127.0.0.1:8181:8080"
