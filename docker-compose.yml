# NOTE: Postgres is external (Neon serverless) — see DATABASE_URL / DATABASE_URL_PY in .env.
# The local `postgres` service was removed; Flyway will baseline against the existing Neon
# schema (V1__init.sql already applied manually). To return to a local Postgres later,
# re-add the postgres service block and switch DATABASE_URL back to jdbc:postgresql://postgres:5432/...

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  agent-service:
    build: ./agent-service
    environment:
      DATABASE_URL_PY: ${DATABASE_URL_PY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_MODEL: ${AI_MODEL}
      DEEP_SHEEK_NVIDIA_API_KEY: ${DEEP_SHEEK_NVIDIA_API_KEY}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL}
      NVIDIA_DEEPSEEK_MODEL: ${NVIDIA_DEEPSEEK_MODEL}
      NVIDIA_QWEN_MODEL: ${NVIDIA_QWEN_MODEL}
      QWEN3_NVIDIA_API_KEY: ${QWEN3_NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8088:8088"

  backend:
    build: ./backend
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DEEP_SHEEK_NVIDIA_API_KEY: ${DEEP_SHEEK_NVIDIA_API_KEY}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL}
      NVIDIA_DEEPSEEK_MODEL: ${NVIDIA_DEEPSEEK_MODEL}
      NVIDIA_QWEN_MODEL: ${NVIDIA_QWEN_MODEL}
      QWEN3_NVIDIA_API_KEY: ${QWEN3_NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-next-80b-a3b-instruct:free}
      AI_SMART_ROUTER_ENABLED: ${AI_SMART_ROUTER_ENABLED:-false}
      PRIMARY_PROVIDER: ${PRIMARY_PROVIDER}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER}
      # Phase 1 Candidate Intelligence Profile — default DARK (no behavior change).
      CANDIDATE_PROFILE_ENABLED: ${CANDIDATE_PROFILE_ENABLED:-false}
      JOBS_MATCHING_PROFILE_SOURCE_ENABLED: ${JOBS_MATCHING_PROFILE_SOURCE_ENABLED:-false}
      JOBS_MATCHING_USE_ENRICHMENT: ${JOBS_MATCHING_USE_ENRICHMENT:-false}
      JOBS_MATCHING_ROLE_RELEVANCE_MIN: ${JOBS_MATCHING_ROLE_RELEVANCE_MIN:-10}
      JOBS_MATCHING_SKILL_DENOM_CAP: ${JOBS_MATCHING_SKILL_DENOM_CAP:-8}
      JOB_RECO_GATE_MIN_SKILLS: ${JOB_RECO_GATE_MIN_SKILLS:-2}
      # Recommended-gate score floor (0-100). 70 = strict curated list; lower → more breadth.
      JOB_RECO_GATE_MIN_SCORE: ${JOB_RECO_GATE_MIN_SCORE:-70}
      CANDIDATE_PROFILE_BACKFILL_THROTTLE_MS: ${CANDIDATE_PROFILE_BACKFILL_THROTTLE_MS:-500}
      # Phase 1.5 — single source of truth hardening. All default DARK (no behavior change).
      PROFILE_SINGLE_SOURCE_ENABLED: ${PROFILE_SINGLE_SOURCE_ENABLED:-false}
      CANDIDATE_PROFILE_REBUILD_ENABLED: ${CANDIDATE_PROFILE_REBUILD_ENABLED:-false}
      CANDIDATE_PROFILE_REBUILD_CRON: "${CANDIDATE_PROFILE_REBUILD_CRON:-0 0 2 ? * SUN}"
      CANDIDATE_PROFILE_REBUILD_MAX_PER_RUN: ${CANDIDATE_PROFILE_REBUILD_MAX_PER_RUN:-200}
      CANDIDATE_RECOMMENDATION_AUDIT_ENABLED: ${CANDIDATE_RECOMMENDATION_AUDIT_ENABLED:-false}
      # Phase 2B-1 — action categorization (AUTO_APPLY/HUMAN_REVIEW/GOOD_MATCH/IGNORE). Default DARK.
      JOB_AUTO_CATEGORIZATION_ENABLED: ${JOB_AUTO_CATEGORIZATION_ENABLED:-false}
      # Phase 2B-5 — hard-reject jobs that violate a mandatory work-mode/location/visa preference. Default DARK.
      JOB_HARD_PREFERENCE_ENABLED: ${JOB_HARD_PREFERENCE_ENABLED:-false}
      # Phase 2B-3 — MatchCache: skip rescoring when nothing changed since the last refresh (24h TTL, Redis). Default DARK.
      JOB_MATCH_CACHE_ENABLED: ${JOB_MATCH_CACHE_ENABLED:-false}
      # Phase 2C-1 — priority engine (CRITICAL/HIGH/MEDIUM/LOW ranking dimension). Default DARK.
      RECOMMENDATION_PRIORITY_ENABLED: ${RECOMMENDATION_PRIORITY_ENABLED:-false}
      # Phase 2C-3 — approval actions (/api/recommendations approve|reject|save|archive → Application). Default DARK.
      RECOMMENDATION_APPROVAL_ENABLED: ${RECOMMENDATION_APPROVAL_ENABLED:-false}
      # Phase 2C-4 — recommendation feedback capture (feeds the behavior profile). Default DARK.
      RECOMMENDATION_FEEDBACK_ENABLED: ${RECOMMENDATION_FEEDBACK_ENABLED:-false}
      # Phase 2D.1 — Resume Tailoring Engine (per-job LLM rewrite, never modifies the original resume). Default DARK.
      RESUME_TAILORING_ENABLED: ${RESUME_TAILORING_ENABLED:-false}
      RESUME_TAILORING_CACHE_ENABLED: ${RESUME_TAILORING_CACHE_ENABLED:-false}
      RESUME_TAILORING_TRIGGER_ON_APPROVE_ENABLED: ${RESUME_TAILORING_TRIGGER_ON_APPROVE_ENABLED:-false}
      RESUME_TAILORING_MIN_LENGTH: ${RESUME_TAILORING_MIN_LENGTH:-800}
      RESUME_TAILORING_MAX_LENGTH: ${RESUME_TAILORING_MAX_LENGTH:-20000}
      # Phase 2D.1.1 — bounded async executor + provider-routing override (production hardening).
      RESUME_TAILORING_EXECUTOR_CORE_POOL_SIZE: ${RESUME_TAILORING_EXECUTOR_CORE_POOL_SIZE:-2}
      RESUME_TAILORING_EXECUTOR_MAX_POOL_SIZE: ${RESUME_TAILORING_EXECUTOR_MAX_POOL_SIZE:-5}
      RESUME_TAILORING_EXECUTOR_QUEUE_CAPACITY: ${RESUME_TAILORING_EXECUTOR_QUEUE_CAPACITY:-50}
      RESUME_TAILORING_PREFERRED_PROVIDERS: ${RESUME_TAILORING_PREFERRED_PROVIDERS:-gemini,groq,deepseek,qwen,openrouter}
      # Phase 2D.2 — ATS Optimization Engine (analyzes the latest tailored resume). Default DARK.
      ATS_OPTIMIZATION_ENABLED: ${ATS_OPTIMIZATION_ENABLED:-false}
      ATS_OPTIMIZATION_TRIGGER_ON_TAILORING_ENABLED: ${ATS_OPTIMIZATION_TRIGGER_ON_TAILORING_ENABLED:-false}
      ATS_OPTIMIZATION_EXECUTOR_CORE_POOL_SIZE: ${ATS_OPTIMIZATION_EXECUTOR_CORE_POOL_SIZE:-2}
      ATS_OPTIMIZATION_EXECUTOR_MAX_POOL_SIZE: ${ATS_OPTIMIZATION_EXECUTOR_MAX_POOL_SIZE:-5}
      ATS_OPTIMIZATION_EXECUTOR_QUEUE_CAPACITY: ${ATS_OPTIMIZATION_EXECUTOR_QUEUE_CAPACITY:-50}
      # Phase 2D.3-2D.7 — Candidate Application Intelligence pipeline. All default DARK.
      GAP_ANALYSIS_ENABLED: ${GAP_ANALYSIS_ENABLED:-false}
      GAP_ANALYSIS_TRIGGER_ENABLED: ${GAP_ANALYSIS_TRIGGER_ENABLED:-false}
      ATS_EXPLAINABILITY_ENABLED: ${ATS_EXPLAINABILITY_ENABLED:-false}
      ATS_EXPLAINABILITY_TRIGGER_ENABLED: ${ATS_EXPLAINABILITY_TRIGGER_ENABLED:-false}
      COVER_LETTER_ENABLED: ${COVER_LETTER_ENABLED:-false}
      COVER_LETTER_TRIGGER_ENABLED: ${COVER_LETTER_TRIGGER_ENABLED:-false}
      APPLICATION_PACKAGE_ENABLED: ${APPLICATION_PACKAGE_ENABLED:-false}
      APPLICATION_PACKAGE_TRIGGER_ENABLED: ${APPLICATION_PACKAGE_TRIGGER_ENABLED:-false}
      AUTO_APPLY_PACKAGE_ENABLED: ${AUTO_APPLY_PACKAGE_ENABLED:-false}
      AUTO_APPLY_TRIGGER_ENABLED: ${AUTO_APPLY_TRIGGER_ENABLED:-false}
      # Phase 2E — Enterprise Auto-Apply Execution Engine (HIGH RISK). Ships DARK + INERT: nothing
      # submits an application; browser automation is a throwing stub (no Playwright dep); every ATS
      # connector is unconfigured. Safety/approval gates default ON (never skippable), pipeline-entry
      # triggers default OFF, so completing a 2D pipeline creates ZERO 2E rows. Do NOT enable without
      # the documented rollout plan.
      APPLICATION_EXECUTION_ENABLED: ${APPLICATION_EXECUTION_ENABLED:-false}
      APPLICATION_EXECUTION_TRIGGER_ENABLED: ${APPLICATION_EXECUTION_TRIGGER_ENABLED:-false}
      BROWSER_AUTOMATION_ENABLED: ${BROWSER_AUTOMATION_ENABLED:-false}
      ATS_CONNECTOR_ENABLED: ${ATS_CONNECTOR_ENABLED:-false}
      APPLICATION_APPROVAL_ENABLED: ${APPLICATION_APPROVAL_ENABLED:-true}
      APPLICATION_SAFETY_ENABLED: ${APPLICATION_SAFETY_ENABLED:-true}
      APPLICATION_SAFETY_TRIGGER_ENABLED: ${APPLICATION_SAFETY_TRIGGER_ENABLED:-false}
      APPLICATION_TRACKING_ENABLED: ${APPLICATION_TRACKING_ENABLED:-false}
      APPLICATION_TRACKING_TRIGGER_ENABLED: ${APPLICATION_TRACKING_TRIGGER_ENABLED:-false}
      APPLICATION_ANALYTICS_ENABLED: ${APPLICATION_ANALYTICS_ENABLED:-false}
      APPLICATION_ANALYTICS_TRIGGER_ENABLED: ${APPLICATION_ANALYTICS_TRIGGER_ENABLED:-false}
      # ---- Phase 3A: Enterprise Application Tracking Workflow (ships DARK, isolated workflow.* namespace) ----
      # 9-worker event-driven workflow tracking an application AFTER submission (Applied -> Offer ->
      # Accepted/Rejected). ALL default false: with stock flags the WorkflowEntryBridge mints nothing, so
      # creating an application produces ZERO Phase 3A rows. Migrations V36-V43 written but NOT applied.
      # Canary one stage at a time: *_ENABLED first (verify /api/diagnostics/<stage>), then *_TRIGGER_ENABLED.
      # Renamed from the 3A spec's APPLICATION_TRACKING_*/APPLICATION_ANALYTICS_* to dodge the 2E vars above.
      WORKFLOW_TRACKING_ENABLED: ${WORKFLOW_TRACKING_ENABLED:-false}
      WORKFLOW_TRACKING_TRIGGER_ENABLED: ${WORKFLOW_TRACKING_TRIGGER_ENABLED:-false}
      WORKFLOW_TIMELINE_ENABLED: ${WORKFLOW_TIMELINE_ENABLED:-false}
      WORKFLOW_TIMELINE_TRIGGER_ENABLED: ${WORKFLOW_TIMELINE_TRIGGER_ENABLED:-false}
      EMAIL_INTELLIGENCE_ENABLED: ${EMAIL_INTELLIGENCE_ENABLED:-false}
      EMAIL_INTELLIGENCE_TRIGGER_ENABLED: ${EMAIL_INTELLIGENCE_TRIGGER_ENABLED:-false}
      INTERVIEW_TRACKING_ENABLED: ${INTERVIEW_TRACKING_ENABLED:-false}
      INTERVIEW_TRACKING_TRIGGER_ENABLED: ${INTERVIEW_TRACKING_TRIGGER_ENABLED:-false}
      WORKFLOW_ANALYTICS_ENABLED: ${WORKFLOW_ANALYTICS_ENABLED:-false}
      WORKFLOW_ANALYTICS_TRIGGER_ENABLED: ${WORKFLOW_ANALYTICS_TRIGGER_ENABLED:-false}
      CAREER_INTELLIGENCE_ENABLED: ${CAREER_INTELLIGENCE_ENABLED:-false}
      CAREER_INTELLIGENCE_TRIGGER_ENABLED: ${CAREER_INTELLIGENCE_TRIGGER_ENABLED:-false}
      # Data retention (Phase 3B prep) — additive, disabled by default. With RETENTION_ENABLED=false
      # the daily scheduler fires but purges nothing. Per-target age windows override as needed.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-false}
      RETENTION_CRON: ${RETENTION_CRON:-0 30 3 * * *}
      RETENTION_WORKFLOW_DEAD_LETTER_DAYS: ${RETENTION_WORKFLOW_DEAD_LETTER_DAYS:-90}
      RETENTION_WORKFLOW_CORRELATION_DAYS: ${RETENTION_WORKFLOW_CORRELATION_DAYS:-180}
      RETENTION_RECOMMENDATION_AUDIT_DAYS: ${RETENTION_RECOMMENDATION_AUDIT_DAYS:-365}
      RETENTION_EXECUTION_AUDIT_DAYS: ${RETENTION_EXECUTION_AUDIT_DAYS:-365}
      RETENTION_RESUME_TAILORING_AUDIT_DAYS: ${RETENTION_RESUME_TAILORING_AUDIT_DAYS:-365}
      # Domestic/International scope derived server-side from the candidate (home/preferred countries).
      JOBS_DISCOVERY_SCOPE_STRICT_ENABLED: ${JOBS_DISCOVERY_SCOPE_STRICT_ENABLED:-false}
      # Adzuna keyed provider — sources jobs PER COUNTRY (incl. India 'in'). Empty keys = provider
      # skipped (isConfigured()=false), so this stays dormant until real keys are set in .env.
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRIES: ${ADZUNA_COUNTRIES:-in,us,gb}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      # Keyless job-board providers (Greenhouse/Lever/Ashby/SmartRecruiters) — no signup needed,
      # just a CSV of board tokens/company slugs/org slugs/company IDs. Empty = provider skipped.
      CAREER_DISCOVERY_GREENHOUSE_ENABLED: ${CAREER_DISCOVERY_GREENHOUSE_ENABLED:-false}
      CAREER_DISCOVERY_GREENHOUSE_BOARDS: ${CAREER_DISCOVERY_GREENHOUSE_BOARDS:-}
      CAREER_DISCOVERY_LEVER_ENABLED: ${CAREER_DISCOVERY_LEVER_ENABLED:-false}
      CAREER_DISCOVERY_LEVER_COMPANIES: ${CAREER_DISCOVERY_LEVER_COMPANIES:-}
      CAREER_DISCOVERY_ASHBY_ENABLED: ${CAREER_DISCOVERY_ASHBY_ENABLED:-false}
      CAREER_DISCOVERY_ASHBY_ORGS: ${CAREER_DISCOVERY_ASHBY_ORGS:-}
      CAREER_DISCOVERY_SMARTRECRUITERS_ENABLED: ${CAREER_DISCOVERY_SMARTRECRUITERS_ENABLED:-false}
      CAREER_DISCOVERY_SMARTRECRUITERS_COMPANIES: ${CAREER_DISCOVERY_SMARTRECRUITERS_COMPANIES:-}
      # Phase 2 Increment A — pgvector semantic embeddings (reuses GEMINI_API_KEY). Default off.
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
      EMBEDDINGS_MAX_PER_RUN: ${EMBEDDINGS_MAX_PER_RUN:-200}
      # Phase 2 Increment B — LLM job enrichment (reuses the AI Gateway). Default off (ships dark).
      JOBS_ENRICH_AI_ENABLED: ${JOBS_ENRICH_AI_ENABLED:-false}
      JOBS_ENRICH_AI_MAX_PER_RUN: ${JOBS_ENRICH_AI_MAX_PER_RUN:-200}
      # Phase 2 Increment C — fuzzy job deduplication (reuses embeddings). Default off (ships dark).
      JOBS_DEDUP_ENABLED: ${JOBS_DEDUP_ENABLED:-false}
      JOBS_DEDUP_MAX_PER_RUN: ${JOBS_DEDUP_MAX_PER_RUN:-200}
      # Phase 2A — Enterprise Job Lake (SHADOW pipeline: job_raw → job_normalized → job_lake). Runs
      # alongside the legacy discovery and never writes into `jobs`. All default DARK (no behavior
      # change). NOTE: master flag is JOB_LAKE_DISCOVERY_ENABLED, not JOB_DISCOVERY_ENABLED — the
      # latter gates the LEGACY pipeline, so reusing it would disable live discovery.
      JOB_LAKE_DISCOVERY_ENABLED: ${JOB_LAKE_DISCOVERY_ENABLED:-false}
      JOB_DISCOVERY_DEDUP_ENABLED: ${JOB_DISCOVERY_DEDUP_ENABLED:-false}
      JOB_SOFTWARE_FILTER_ENABLED: ${JOB_SOFTWARE_FILTER_ENABLED:-false}
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      MINIO_BUCKET: ${S3_BUCKET}
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5173:80"

volumes:
  miniodata: {}
