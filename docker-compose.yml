# NOTE: Postgres is external (Neon serverless) — see DATABASE_URL / DATABASE_URL_PY in .env.
# The local `postgres` service was removed; Flyway will baseline against the existing Neon
# schema (V1__init.sql already applied manually). To return to a local Postgres later,
# re-add the postgres service block and switch DATABASE_URL back to jdbc:postgresql://postgres:5432/...
#
# ── Phase 12A — resource limits ───────────────────────────────────────────────
# Until this phase NO service had a memory limit, so every container could expand
# into the whole host and the JVM sized its heap off total host RAM. Limits below are
# derived from MEASURED usage on the production VM (2026-08-03), not estimates:
#
#   service         measured    limit    headroom rationale
#   backend           621 MiB   2048m    must also cover the Chromium child process
#                                        Playwright launches INSIDE this container
#   minio             101 MiB    256m    grows with object count
#   agent-service      36 MiB    512m    Python/LangGraph can spike per run
#   redis              10 MiB    128m    tiny, but unbounded without maxmemory
#   frontend            1 MiB     64m    static nginx
#                                ─────
#                                3008m   vs ~4.3 GiB free after OS/nginx/dockerd
#
# Limits are ceilings, not reservations. Kafka + ZooKeeper were removed entirely
# (they had zero consumers and zero producers after the event path was deleted),
# recovering their 1348m of ceiling and ~1.11 GiB of measured RSS.
#
# Deliberately NO `cpus:` caps anywhere. The VM has 1 vCPU; hard-capping fractional
# CPU on a single core reliably makes contention worse, not better. CPU is the real
# constraint here, and it is managed by keeping BrowserLeasePool at max-leases=1 —
# not by throttling containers against each other.
#
# `restart: unless-stopped` added to every service. Previously there was none, so a
# single OOM-killed container stayed down while systemd's RemainAfterExit=yes unit
# still reported the stack "active".

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    # No host port published: only the backend container needs Redis, reached
    # internally at redis:6379. Publishing 6379 to the VM's public interface
    # would expose an unauthenticated Redis instance to the internet.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 256m
    command: server /data --console-address ":9001"
    # The official minio/minio image requires exactly these two names — imposed by the
    # image itself, not our choice, so this is the one genuine "deployment-specific
    # override" left in the whole stack. Sourced directly from the same canonical
    # MINIO_ACCESS_KEY/MINIO_SECRET_KEY the backend also reads (via env_file below) —
    # one value, one name, just substituted into the name this specific image demands.
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    # No ports published to the host on purpose: the backend/agent-service reach
    # MinIO over the internal Docker network at http://minio:9000 (MINIO_ENDPOINT),
    # so publishing 9000/9001 would only expose the S3 API + web console to
    # anyone who can reach this VM's IP for no operational benefit. If you need
    # to browse the console for one-off debugging, temporarily add back
    # "127.0.0.1:9001:9001" here, `docker compose up -d minio`, then SSH-tunnel
    # to it (`ssh -L 9001:localhost:9001 user@vm`) and revert afterward.
    volumes:
      - miniodata:/data
    # `mc` (MinIO Client) is bundled inside the official minio/minio server image
    # specifically to support this pattern — MinIO's own documented healthcheck,
    # not an extra install. `mc ready local` checks the server's own readiness
    # state directly, no HTTP round-trip needed.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent-service:
    build: ./agent-service
    restart: unless-stopped
    mem_limit: 512m
    # config.py's pydantic-settings BaseSettings fields already match these var names
    # 1:1 case-insensitively (gemini_api_key <-> GEMINI_API_KEY, etc.), so this is a
    # pure maintainability change, not a bug fix — same canonical env file as backend.
    env_file:
      - .env
    # PORT must be pinned here: the shared .env carries PORT=8080 for the Spring
    # backend, but this Dockerfile's CMD is `uvicorn ... --port ${PORT:-8088}` —
    # without this override the env_file value leaks in and uvicorn binds 8080,
    # breaking the healthcheck below AND the backend's AGENT_SERVICE_URL (both
    # expect 8088). environment: beats env_file: in Compose precedence.
    environment:
      PORT: "8088"
    # Loopback-only publish — reachable at localhost:8088 by the host-level
    # Nginx reverse proxy (production hardening, /agent route) and nothing
    # else. Still unreachable from outside the VM: 127.0.0.1 never appears on
    # the public interface, unlike a bare "8088:8088" (which binds 0.0.0.0).
    # The backend still reaches this over the internal Docker network at
    # http://agent-service:8088 (AGENT_SERVICE_URL below) — this publish is
    # purely for Nginx's benefit, not a second access path for the backend.
    ports:
      - "127.0.0.1:8088:8088"
    # python:3.12-slim is Debian-based (no busybox, no curl/wget by default) — but
    # the interpreter that's already running the app ships urllib in its standard
    # library, so this needs zero extra packages. Hits the same GET /health route
    # main.py:207 exposes.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: ./backend
    restart: unless-stopped
    # Covers the JVM (768m heap + ~450m non-heap) AND the Chromium child process
    # (~600m peak) that Playwright launches inside this container. See the heap
    # rationale in backend/Dockerfile — the two limits are set as a pair.
    mem_limit: 2048m
    # Chromium maps renderer shared memory into /dev/shm. Docker's default is 64 MiB
    # (verified on the VM), which crashes tabs on any non-trivial page. The launch
    # flags also pass --disable-dev-shm-usage as belt-and-braces, but raising this is
    # the correct primary fix; relying on the flag alone pushes that traffic to /tmp.
    shm_size: 256m
    # Chromium spawns many short-lived child processes and file descriptors per page.
    # The default nofile ceiling is generous on this host, but pinning it makes the
    # requirement explicit rather than inherited from whatever the daemon defaults to.
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    depends_on:
      redis:
        condition: service_healthy
      # Not a hard technical requirement for Spring context startup — WorkflowService
      # calls agent-service lazily, only when a user triggers a workflow run, so the
      # JVM would boot fine either way. Added anyway per the SRE decision to close
      # the post-deploy race window where a workflow request could arrive before
      # agent-service is ready, producing an avoidable connection-refused error on
      # an otherwise-healthy-looking backend right after a fresh `docker compose up`.
      agent-service:
        condition: service_healthy
    # Canonical, single-source env file — every variable application.yml can read lives
    # here under the exact name Spring Boot's relaxed env-var binding expects (no more
    # per-variable mirroring into this block, and no more "added a var to application.yml
    # but forgot to wire it here" class of bug). See DEPLOYMENT_ORACLE_CLOUD.md for the
    # VM-side symlink that keeps this and /etc/careerpilot/careerpilot.env as one file.
    env_file:
      - .env
    # Loopback-only publish (production hardening) — reachable at
    # localhost:8080 by the host-level Nginx reverse proxy (/api route) and
    # nothing else. Previously "8080:8080", which binds 0.0.0.0:8080 and was
    # directly reachable from the internet; Nginx now sits in front of it.
    ports:
      - "127.0.0.1:8080:8080"
    # Phase 12A — this previously relied on BusyBox's built-in wget from the Alpine
    # base. The runtime is now debian:bookworm-slim, which does NOT ship wget, so
    # backend/Dockerfile installs it explicitly for exactly this probe. If that apt
    # line is ever pruned as "unused", this healthcheck fails and the container is
    # reported unhealthy forever — the two are coupled on purpose.
    # --spider makes it a HEAD-style check-only request, no body download.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    mem_limit: 64m
    # Loopback-only publish (production hardening) — reachable at
    # localhost:5173 by the host-level Nginx reverse proxy (/ route) and
    # nothing else. Previously "5173:80" (bound 0.0.0.0:5173, directly
    # internet-reachable) — Nginx is now the only public entry point.
    ports:
      - "127.0.0.1:5173:80"

volumes:
  miniodata: {}
